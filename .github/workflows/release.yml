name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # R7（Phase-2b）：tag 触发发布同样先过依赖审计门禁（与 ci.yml audit job
  # 相同语义）；审计失败则 build-and-release 不执行，杜绝带漏洞依赖发版。
  audit:
    name: Dependency audits (cargo + pnpm)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cargo-audit (prebuilt)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Rust dependency audit
        run: cargo audit

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web dependencies (frozen)
        run: pnpm --dir web install --frozen-lockfile

      - name: Web dependency audit
        run: pnpm audit --dir web --audit-level high

  build-and-release:
    name: Build & Release (${{ matrix.target }})
    needs: [audit]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: ponyllm-linux-x86_64.tar.gz
            bin_path: target/x86_64-unknown-linux-gnu/release/ponyllm
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: ponyllm-windows-x86_64.zip
            bin_path: target/x86_64-pc-windows-msvc/release/ponyllm.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: ponyllm-macos-arm64.tar.gz
            bin_path: target/aarch64-apple-darwin/release/ponyllm

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }} -p ponyllm-cli

      - name: Package Binary (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          tar -czf ${{ matrix.artifact_name }} -C target/${{ matrix.target }}/release ponyllm

      - name: Package Binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/ponyllm.exe -DestinationPath ${{ matrix.artifact_name }}

      - name: Compute checksum
        shell: bash
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum ${{ matrix.artifact_name }} > ${{ matrix.artifact_name }}.sha256
          else
            shasum -a 256 ${{ matrix.artifact_name }} > ${{ matrix.artifact_name }}.sha256
          fi

      - name: Upload Release Artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.artifact_name }}
            ${{ matrix.artifact_name }}.sha256
          generate_release_notes: true
