name: CI & Docker Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

# main 上的部署必须串行：两次连续合并会各自钉自己的 digest 并对同一批
# Deployment 发起滚动，interleaving 会让「清单即真相」与集群实际镜像脱节，
# 也会让长流门禁在别人滚动到一半时误判 503（实证 2026-11-24 PR#4/#5）。
# PR 侧则相反——新提交直接取消旧运行，省 runner。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  script-gates:
    name: Script & contract drift gates (offline)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # B019 左移：验收脚本引用的 API 端点 / Deployment 名必须与契约和清单一致。
      # 纯静态检查（bash -n + web/openapi.json + deploy/ponyllm-deployment.yaml），无需集群。
      - name: Verify script/contract drift (API paths & deployment names)
        shell: bash
        run: bash scripts/check-verify-contract-drift.sh

  # backlog 账本门（pg-backlog v3）：独立 job，不并入服务端测试矩阵——
  # 判据真源是 scripts/backlog.mjs（v3 = lint 批次/fold 不变量 + doctor 跨归档/租约 + verify-archive 封存），
  # 与 Rust 构建无关，分开跑才不会互相拖累。
  # 账本缺失 → 门自己打印"跳过"并 exit 0；布局不一致（有 log/ 缺 MODEL）/ 无 node → fail-closed。
  backlog-ledger:
    name: "Backlog ledger gate (v3: lint + doctor + verify-archive)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: backlog-gate (lint + doctor + verify-archive)
        shell: bash
        run: bash .meta/gates/backlog-gate.sh

      - name: backlog-gate 负样本 spec（P1–P3 放行 + N1–N9 拒绝 + H）
        shell: bash
        run: bash .meta/gates/backlog-gate.spec.sh

  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Verify ADR notes and negative specs
        shell: bash
        run: |
          bash .agents/skills/write-adr/verify-note.sh
          bash .agents/skills/write-adr/tests/test-verify-note.sh

      - name: Check deployment prober CLI contract
        shell: bash
        run: bash tests/pre-flight/check-ci-prober-cli-contract.sh

      # digest pin 回写的并发语义防呆：pin 是「清单=最新 digest」的单点声明，
      # 不得走 rebase（连续两次 main push 会抢同一批 image 行，rebase 必冲突）。
      # 同时跑验收脚本的只读探针重试自测（传输失败重试 / 真实 4xx-5xx 不重试）。
      - name: Check CI digest pin semantics (concurrency-safe)
        shell: bash
        run: |
          bash tests/pre-flight/check-ci-digest-pin-semantics.sh
          bash tests/pre-flight/check-ci-digest-pin-semantics.spec.sh
          bash tests/pre-flight/http-retry.spec.sh

      # 2026-10-14 事故回归门禁：CI 身份缺集群级 nodes 读权限时，发布链路必须
      # fail-closed（禁止静默跳过全部滚动 / 以 0 个 Pod 判定 PASS）。纯 shim 驱动，
      # 不需要集群连接。
      - name: Check deploy fail-closed gates (RBAC 403 / empty-set parity)
        shell: bash
        run: bash tests/pre-flight/test_deploy_failclosed_rbac.sh

      - name: Check workspace compilation
        run: cargo check --workspace

      - name: Run all workspace unit and integration tests
        run: cargo test --workspace

  web:
    name: Web console gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web dependencies (frozen)
        run: pnpm --dir web install --frozen-lockfile

      - name: Web lint (same command as local)
        run: pnpm --dir web lint

      - name: Web typecheck (same command as local)
        run: pnpm --dir web typecheck

      - name: Web unit tests (same command as local)
        run: pnpm --dir web test

      - name: Web production build (catches base/asset breakage)
        run: pnpm --dir web build

  audit:
    name: Dependency audits (cargo + pnpm)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cargo-audit (prebuilt)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Rust dependency audit
        # 漏洞（含 unmaintained/unsound 之外的安全项）→ 非零退出阻断发布；
        # unmaintained/unsound 警告不阻断（当前为 fxhash/paste/rustls-pemfile/lru）。
        run: cargo audit

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web dependencies (frozen)
        run: pnpm --dir web install --frozen-lockfile

      - name: Web dependency audit
        # high 及以上漏洞 → 非零退出（brace-expansion 2.1.7 后应为 0）
        run: pnpm audit --dir web --audit-level high

  build-and-push-image:
    name: Build & Push GHCR Image
    needs: [test, web, audit]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # 严格防护：仅在 main 分支 push 时构建并推镜像，PR 绝不执行，杜绝外部 PR 投毒与凭据读取
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      # 阿里云推送的 manifest digest，直接供 deploy job 钉入清单，
      # 避免 runner 二次 docker pull（实测对国内仓库偶发网络瞬断）。
      aliyun-digest: ${{ steps.build-aliyun.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --bin ponyllm

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build web assets
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push Docker image (GHCR)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- GitOps 生产推送（阿里云容器镜像仓库）----
      # 生产 Deployment（deploy/ponyllm-deployment.yaml）经 Keel 轮询该仓库的
      # `latest` 标签自动零停机滚动。凭据为 GitHub Secrets
      # （ALIYUN_REGISTRY_USERNAME / ALIYUN_REGISTRY_PASSWORD）。
      - name: Log in to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: crpi-3cfwwtc3um8h6d3q.cn-hangzhou.personal.cr.aliyuncs.com
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Extract metadata for Aliyun prod image
        id: meta-aliyun
        uses: docker/metadata-action@v5
        with:
          images: crpi-3cfwwtc3um8h6d3q.cn-hangzhou.personal.cr.aliyuncs.com/job-copilot/api-v2
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push Docker image (Aliyun prod)
        id: build-aliyun
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta-aliyun.outputs.tags }}
          labels: ${{ steps.meta-aliyun.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 阿里云 ACR 拒绝 buildx 默认 provenance/sbom 生成的 OCI attestation
          # manifest（application/vnd.oci.empty.v1+json → denied: unknown
          # manifest class）。关闭后推送纯平台 manifest，与 ACR 兼容
          # （GHCR 步骤保留 provenance，二者要求不同）。
          provenance: false
          sbom: false

  # ---- GitOps 生产部署（CI deploy job，确定性 digest 钉）----
  # 实证（2026-09-29）：Keel 的 `latest`+force 自动滚动不可靠——
  #   1) 相同标签不产生 spec 变更 → 滚动不触发/不完整；
  #   2) IfNotPresent + 可变标签 → 节点缓存旧 digest → 混合版本。
  # 改由 CI 直接驱动：镜像推送成功后，本 job 解析 sha-<short> 标签的
  # registry digest → 钉入 deploy/ponyllm-deployment.yaml 全部 4 个 image 行
  # （[skip ci] commit-back，清单即真相）→ apply Deployment + IngressRoute →
  # 4 个 Deployment rollout 验证 → 冒烟。加权路由见
  # deploy/ponyllm-ingress-routes.yaml（dev:preprod:proserver:tencent = 5:4:1:1）。
  # 集群凭据：KUBECONFIG_BASE64（最小权限 ci-deployer，仅 ponyllm 命名
  # 空间 deployments/services + pods 只读）；冒烟用 PONYLLM_API_KEY。
  deploy:
    name: GitOps Deploy (prod)
    needs: build-and-push-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig (scoped ci-deployer)
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_BASE64 }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Log in to Aliyun registry (resolve digest)
        uses: docker/login-action@v3
        with:
          registry: crpi-3cfwwtc3um8h6d3q.cn-hangzhou.personal.cr.aliyuncs.com
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Resolve pushed image digest
        id: resolve
        run: |
          DIGEST="${{ needs.build-and-push-image.outputs.aliyun-digest }}"
          if [ -z "$DIGEST" ]; then
            echo "job output empty; falling back to docker pull"
            IMG="crpi-3cfwwtc3um8h6d3q.cn-hangzhou.personal.cr.aliyuncs.com/job-copilot/api-v2"
            DIGEST="$(docker pull "${IMG}:sha-${GITHUB_SHA::7}" 2>&1 | grep -oE 'Digest: sha256:[0-9a-f]{64}' | tail -1 | cut -d' ' -f2)"
          fi
          [ -n "$DIGEST" ] || { echo "FAIL: could not resolve digest for sha-${GITHUB_SHA::7}"; exit 1; }
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "resolved: crpi-3cfwwtc3um8h6d3q.cn-hangzhou.personal.cr.aliyuncs.com/job-copilot/api-v2@$DIGEST"

      # 本步只做「解析 + 断言」：把 digest 钉进工作区清单并断言恰 4 行。
      # 真正落盘的钉在下一步（Commit digest pin），它从 origin/main 基线重钉，
      # 因此这里的工作区改动会被覆盖——两处都必须用同一条 sed 表达式。
      - name: Pin digest into manifest
        run: |
          DIGEST="${{ steps.resolve.outputs.digest }}"
          IMG="crpi-3cfwwtc3um8h6d3q.cn-hangzhou.personal.cr.aliyuncs.com/job-copilot/api-v2@$DIGEST"
          # 替换所有 image 行（4 个 Deployment 共用同一镜像，sed 必须带 -g）
          sed -i "s|image: crpi-3cfwwtc3um8h6d3q.cn-hangzhou.personal.cr.aliyuncs.com/job-copilot/api-v2@sha256:[0-9a-f]*|image: $IMG|g" deploy/ponyllm-deployment.yaml
          # 断言恰 4 行 image 已钉（4 个 Deployment 各 1 行，漏钉即 FAIL）
          COUNT=$(grep -c "image: crpi-3cfwwtc3um8h6d3q.cn-hangzhou.personal.cr.aliyuncs.com/job-copilot/api-v2@" deploy/ponyllm-deployment.yaml)
          echo "pinned image lines: $COUNT (expect 4)"
          [ "$COUNT" -eq 4 ] || { echo "FAIL: expected 4 image lines pinned, got $COUNT"; exit 1; }

      - name: Commit digest pin back to main (skip CI)
        run: |
          set -uo pipefail
          git config user.name "ponyllm-ci"
          git config user.email "ci@ponyllm.local"
          MANIFEST=deploy/ponyllm-deployment.yaml
          DIGEST="${{ steps.resolve.outputs.digest }}"
          IMG="crpi-3cfwwtc3um8h6d3q.cn-hangzhou.personal.cr.aliyuncs.com/job-copilot/api-v2@$DIGEST"
          # pin 是「清单 = 最新 digest」的单点声明，不带历史语义：连续两次 main push
          # 会各自把同一批 image 行改成自己的 digest，旧写法的 fetch+rebase 必然
          # content conflict（实证 2026-11-24：PR#4 与 PR#5 连续合并，两次部署均红）。
          # 新口径：只有「本 SHA 仍是 origin/main tip」的那一次 run 负责钉；被后来者
          # 超越的 run 交还清单（checkout origin/main 版本）并放行，由超越它的 run 钉
          # 自己的 digest —— 无 rebase、无冲突，也不会用旧镜像逆行覆盖新清单。
          for attempt in 1 2 3; do
            git fetch origin main
            TIP=$(git rev-parse origin/main)
            if [ "$TIP" != "$GITHUB_SHA" ]; then
              echo "superseded: origin/main=$TIP != 本 run SHA=$GITHUB_SHA —— 交还清单并跳过 pin（由超越者钉其 digest）"
              git checkout origin/main -- "$MANIFEST"
              exit 0
            fi
            # 以最新清单为基线重钉：sed 只认 sha256 占位，重复执行结果一致（幂等）
            git checkout origin/main -- "$MANIFEST"
            sed -i "s|image: crpi-3cfwwtc3um8h6d3q.cn-hangzhou.personal.cr.aliyuncs.com/job-copilot/api-v2@sha256:[0-9a-f]*|image: $IMG|g" "$MANIFEST"
            COUNT=$(grep -c "image: crpi-3cfwwtc3um8h6d3q.cn-hangzhou.personal.cr.aliyuncs.com/job-copilot/api-v2@" "$MANIFEST")
            echo "pinned image lines: $COUNT (expect 4)"
            [ "$COUNT" -eq 4 ] || { echo "FAIL: expected 4 image lines pinned, got $COUNT"; exit 1; }
            git add "$MANIFEST"
            if git diff --cached --quiet; then
              echo "no manifest change (digest already current)"
              exit 0
            fi
            git commit -m "deploy(prod): pin image digest sha256:${GITHUB_SHA::7} [skip ci]"
            # 并发 push 造成非快进拒绝：丢弃本次提交后重来（不进 rebase，故不会冲突）
            if git push origin HEAD:main; then
              echo "digest pinned on attempt ${attempt}"
              exit 0
            fi
            git reset --hard HEAD~1
            echo "push rejected (concurrent main update), retrying (attempt ${attempt}/3)"
            sleep 5
          done
          echo "FAIL: could not pin digest after 3 attempts"
          exit 1

      - name: Apply non-rolling manifests (IngressRoute)
        run: |
          # --validate=false：跳过 API server OpenAPI 大 payload 下载（GitHub
          # runner → 175.24.73.251:6443 偶发 http2 连接中断）；网络瞬断用 3 次重试兜底。
          # IngressRoute 等非 Deployment 资源无滚动语义，单次 apply。
          for i in 1 2 3; do
            if kubectl apply --validate=false -f deploy/ponyllm-ingress-routes.yaml; then
              exit 0
            fi
            echo "apply attempt $i failed; retrying in 5s"
            sleep 5
          done
          exit 1

      - name: Serialized rollout across roles (C1 gate + C3 continuity prober)
        env:
          PONYLLM_API_KEY: ${{ secrets.PONYLLM_API_KEY }}
          PONYLLM_BASE_URL: https://tokens.ponyjob.top
        run: |
          # 逐 role (dev -> preprod -> proserver -> tencent) 串行滚动并执行 drain + 长流门禁 + 级联回滚
          bash scripts/serialized-rollout.sh

      - name: Cluster Image Parity Gate (Anti-Split-Brain)
        run: |
          # 机械硬门禁：断言全节点 Deployment 与 Pod 镜像 100% 绝对一致，杜绝版本撕裂
          bash tests/pre-flight/check-cluster-image-parity.sh

      - name: Post-deploy smoke
        if: env.PONYLLM_API_KEY != ''
        env:
          PONYLLM_API_KEY: ${{ secrets.PONYLLM_API_KEY }}
          PONYLLM_BASE_URL: https://tokens.ponyjob.top
        run: |
          bash scripts/post-deploy-smoke.sh

      # 发布后真链验收门禁（B019 配套）：多角色形态 / rollout 收敛 / 逐 Pod health /
      # reload 稳定性 / 锁窗口。写测试 [6/7] 在 CI 中跳过（ci-deployer 无 live-config
      # 写权限，且 CI 不应改生产配置）；该步由发布操作员在具权限终端补跑完整版。
      - name: Post-deploy full verification (phase3-verify)
        env:
          PONYLLM_ADMIN_TOKEN: ${{ secrets.PONYLLM_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${PONYLLM_ADMIN_TOKEN:-}" ]; then
            echo "::error::admin 凭据未配置（secrets.PONYLLM_API_KEY 为空）——发布后验收门禁 fail-closed"
            exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
            -H "Authorization: Bearer ${PONYLLM_ADMIN_TOKEN}" \
            https://tokens.ponyjob.top/api/admin/overview || echo 000)
          if [ "$code" != "200" ]; then
            # 凭据仅 inference 作用域时不静默放行：跑 kube-only 收敛门禁并显式告警，
            # 要求运维用 admin token 补跑完整验收。
            echo "::warning::admin 面不可用（HTTP $code）：CI 降级为 kube-only 收敛门禁；请用 admin token 补跑 scripts/phase3-verify.sh"
            bash tests/pre-flight/check-cluster-image-parity.sh
            bash -c 'for d in $(kubectl -n ponyllm get deploy -l app.kubernetes.io/name=ponyllm,app.kubernetes.io/component=gateway -o jsonpath="{range .items[*]}{.metadata.name}{\"\n\"}{end}"); do kubectl -n ponyllm rollout status deploy/$d --timeout=300s; done'
            exit 0
          fi
          # CI runner 在集群外：基址走公网入口；Pod IP 逐副本探测不可达故不传 --pod-ips。
          bash scripts/phase3-verify.sh \
            --base-url https://tokens.ponyjob.top \
            --skip-write-test
