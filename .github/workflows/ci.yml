name: CI & Docker Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Verify ADR notes and negative specs
        shell: bash
        run: |
          bash .agents/skills/write-adr/verify-note.sh
          bash .agents/skills/write-adr/tests/test-verify-note.sh

      - name: Check task system governance
        shell: bash
        run: bash .meta/gates/check-tasks.sh

      - name: Check workspace compilation
        run: cargo check --workspace

      - name: Run all workspace unit and integration tests
        run: cargo test --workspace

  web:
    name: Web console gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web dependencies (frozen)
        run: pnpm --dir web install --frozen-lockfile

      - name: Web lint (same command as local)
        run: pnpm --dir web lint

      - name: Web typecheck (same command as local)
        run: pnpm --dir web typecheck

      - name: Web unit tests (same command as local)
        run: pnpm --dir web test

      - name: Web production build (catches base/asset breakage)
        run: pnpm --dir web build

  build-and-push-image:
    name: Build & Push GHCR Image
    needs: [test, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # 严格防护：仅在 main 分支 push 时构建并推镜像，PR 绝不执行，杜绝外部 PR 投毒与凭据读取
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      # 阿里云推送的 manifest digest，直接供 deploy job 钉入清单，
      # 避免 runner 二次 docker pull（实测对国内仓库偶发网络瞬断）。
      aliyun-digest: ${{ steps.build-aliyun.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --bin ponyllm

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build web assets
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push Docker image (GHCR)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- GitOps 生产推送（阿里云容器镜像仓库）----
      # 生产 Deployment（deploy/ponyllm-deployment.yaml）经 Keel 轮询该仓库的
      # `latest` 标签自动零停机滚动。凭据为 GitHub Secrets
      # （ALIYUN_REGISTRY_USERNAME / ALIYUN_REGISTRY_PASSWORD）。
      - name: Log in to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: crpi-3cfwwtc3um8h6d3q.cn-hangzhou.personal.cr.aliyuncs.com
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Extract metadata for Aliyun prod image
        id: meta-aliyun
        uses: docker/metadata-action@v5
        with:
          images: crpi-3cfwwtc3um8h6d3q.cn-hangzhou.personal.cr.aliyuncs.com/job-copilot/api-v2
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push Docker image (Aliyun prod)
        id: build-aliyun
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta-aliyun.outputs.tags }}
          labels: ${{ steps.meta-aliyun.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 阿里云 ACR 拒绝 buildx 默认 provenance/sbom 生成的 OCI attestation
          # manifest（application/vnd.oci.empty.v1+json → denied: unknown
          # manifest class）。关闭后推送纯平台 manifest，与 ACR 兼容
          # （GHCR 步骤保留 provenance，二者要求不同）。
          provenance: false
          sbom: false

  # ---- GitOps 生产部署（CI deploy job，确定性 digest 钉）----
  # 实证（2026-09-29）：Keel 的 `latest`+force 自动滚动不可靠——
  #   1) 相同标签不产生 spec 变更 → 滚动不触发/不完整；
  #   2) IfNotPresent + 可变标签 → 节点缓存旧 digest → 混合版本。
  # 改由 CI 直接驱动：镜像推送成功后，本 job 解析 sha-<short> 标签的
  # registry digest → 钉入 deploy/ponyllm-deployment.yaml 全部 4 个 image 行
  # （[skip ci] commit-back，清单即真相）→ apply Deployment + IngressRoute →
  # 4 个 Deployment rollout 验证 → 冒烟。加权路由见
  # deploy/ponyllm-ingress-routes.yaml（dev:preprod:proserver:tencent = 5:4:1:1）。
  # 集群凭据：KUBECONFIG_BASE64（最小权限 ci-deployer，仅 ponyllm 命名
  # 空间 deployments/services + pods 只读）；冒烟用 PONYLLM_API_KEY。
  deploy:
    name: GitOps Deploy (prod)
    needs: build-and-push-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig (scoped ci-deployer)
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_BASE64 }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Log in to Aliyun registry (resolve digest)
        uses: docker/login-action@v3
        with:
          registry: crpi-3cfwwtc3um8h6d3q.cn-hangzhou.personal.cr.aliyuncs.com
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Resolve pushed image digest
        id: resolve
        run: |
          DIGEST="${{ needs.build-and-push-image.outputs.aliyun-digest }}"
          if [ -z "$DIGEST" ]; then
            echo "job output empty; falling back to docker pull"
            IMG="crpi-3cfwwtc3um8h6d3q.cn-hangzhou.personal.cr.aliyuncs.com/job-copilot/api-v2"
            DIGEST="$(docker pull "${IMG}:sha-${GITHUB_SHA::7}" 2>&1 | grep -oE 'Digest: sha256:[0-9a-f]{64}' | tail -1 | cut -d' ' -f2)"
          fi
          [ -n "$DIGEST" ] || { echo "FAIL: could not resolve digest for sha-${GITHUB_SHA::7}"; exit 1; }
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "resolved: crpi-3cfwwtc3um8h6d3q.cn-hangzhou.personal.cr.aliyuncs.com/job-copilot/api-v2@$DIGEST"

      - name: Pin digest into manifest
        run: |
          DIGEST="${{ steps.resolve.outputs.digest }}"
          IMG="crpi-3cfwwtc3um8h6d3q.cn-hangzhou.personal.cr.aliyuncs.com/job-copilot/api-v2@$DIGEST"
          # 替换所有 image 行（4 个 Deployment 共用同一镜像，sed 必须带 -g）
          sed -i "s|image: crpi-3cfwwtc3um8h6d3q.cn-hangzhou.personal.cr.aliyuncs.com/job-copilot/api-v2@sha256:[0-9a-f]*|image: $IMG|g" deploy/ponyllm-deployment.yaml
          # 断言恰 4 行 image 已钉（4 个 Deployment 各 1 行，漏钉即 FAIL）
          COUNT=$(grep -c "image: crpi-3cfwwtc3um8h6d3q.cn-hangzhou.personal.cr.aliyuncs.com/job-copilot/api-v2@" deploy/ponyllm-deployment.yaml)
          echo "pinned image lines: $COUNT (expect 4)"
          [ "$COUNT" -eq 4 ] || { echo "FAIL: expected 4 image lines pinned, got $COUNT"; exit 1; }

      - name: Commit digest pin back to main (skip CI)
        run: |
          git config user.name "ponyllm-ci"
          git config user.email "ci@ponyllm.local"
          git add deploy/ponyllm-deployment.yaml
          if git diff --cached --quiet; then
            echo "no manifest change (digest already current)"
          else
            git commit -m "deploy(prod): pin image digest sha256:${GITHUB_SHA::7} [skip ci]"
            git push origin main
          fi

      - name: Apply manifests
        run: |
          # --validate=false：跳过 API server OpenAPI 大 payload 下载（GitHub
          # runner → 175.24.73.251:6443 偶发 http2 连接中断）；清单已由
          # pre-commit/CI 多轮验证。网络瞬断用 3 次重试兜底。
          for i in 1 2 3; do
            if kubectl apply --validate=false \
              -f deploy/ponyllm-deployment.yaml \
              -f deploy/ponyllm-ingress-routes.yaml; then
              exit 0
            fi
            echo "apply attempt $i failed; retrying in 5s"
            sleep 5
          done
          exit 1

      - name: Wait for rollout (auto-rollback on failure)
        run: |
          FAILED=""
          for deploy in ponyllm-gateway-dev ponyllm-gateway-preprod ponyllm-gateway-proserver ponyllm-gateway-tencent; do
            ok=""
            for i in 1 2 3; do
              if kubectl -n ponyllm rollout status deploy/$deploy --timeout=300s; then
                ok=1
                break
              fi
              echo "rollout status attempt $i for $deploy failed; retrying in 5s"
              sleep 5
            done
            if [ -z "$ok" ]; then
              echo "::warning::$deploy rollout failed — rolling back"
              # 新 Deployment 无先前 revision 时 undo 会报错，|| true 兜底
              kubectl -n ponyllm rollout undo deploy/$deploy || true
              FAILED="$FAILED $deploy"
            fi
          done
          if [ -n "$FAILED" ]; then
            echo "FAIL: rollout failed for:$FAILED"
            exit 1
          fi

      - name: Post-deploy smoke
        if: env.PONYLLM_API_KEY != ''
        env:
          PONYLLM_API_KEY: ${{ secrets.PONYLLM_API_KEY }}
          PONYLLM_BASE_URL: https://tokens.ponyjob.top
        run: |
          bash scripts/post-deploy-smoke.sh
