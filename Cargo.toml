[workspace]
resolver = "2"
members = [
    "crates/ponyllm-protocol",
    "crates/ponyllm-core",
    "crates/ponyllm-config",
    "crates/ponyllm-server",
    "crates/ponyllm-cli",
    "crates/ponyllm-billing",
    "crates/ponyllm",
]

[workspace.package]
version = "0.2.48"
edition = "2021"
authors = ["ponyllm team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/lanhui100/ponyllm"

[workspace.dependencies]
# Protocol & serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "2.0"
toml = "0.8"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
flate2 = "1.0"
tar = "0.4"
tempfile = "3.17"

# Async & Networking
tokio = { version = "1.43", features = ["full"] }
tokio-stream = "0.1"
bytes = "1.10"
futures = "0.3"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
axum = { version = "0.8", features = ["tokio", "http2"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
utoipa = "5"
eventsource-stream = "0.2"

# Observability & CLI & TUI
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "time"] }
clap = { version = "4.5", features = ["derive", "env"] }
inquire = "0.7"
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
parking_lot = "0.12"
dashmap = "6.1"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.13", features = ["v4", "serde"] }

# Commercial persistence (Stage 1). PostgreSQL is the only financial source of
# truth; no ORM: the migration runner uses the low-level driver directly.
tokio-postgres = "0.7"

# Multi-node HA (2026-09-28): trait methods that must stay dyn-compatible.
async-trait = "0.1"

# Kubernetes Secret config backend (KubernetesConfigStore). kube 0.95 pairs
# with k8s-openapi 0.23 which carries the `v1_31` feature matching the k3s
# production cluster (k3s v1.31.6). rustls-tls only — no native-tls/openssl.
kube = { version = "0.95", default-features = false, features = ["client", "rustls-tls"] }
k8s-openapi = { version = "0.23", features = ["v1_31"] }
# Secret wire encoding (base64 standard alphabet with padding).
base64 = "0.22"
# Advisory-lock PG connection TLS (postgres_rustls over the same rustls 0.23
# chain kube already pulls in; native system roots via rustls-native-certs).
postgres_rustls = "0.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["logging", "std", "tls12", "ring"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"

# Internal workspace crates
ponyllm-protocol = { path = "crates/ponyllm-protocol" }
ponyllm-core = { path = "crates/ponyllm-core" }
ponyllm-config = { path = "crates/ponyllm-config" }
ponyllm-server = { path = "crates/ponyllm-server" }
ponyllm-billing = { path = "crates/ponyllm-billing" }
ponyllm = { path = "crates/ponyllm" }

[profile.dev]
debug = 1
incremental = true

[profile.test]
debug = 1
