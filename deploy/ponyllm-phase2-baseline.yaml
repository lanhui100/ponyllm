apiVersion: v1
kind: Service
metadata:
  name: ponyllm-pod-service
  namespace: ponyllm
  labels:
    app.kubernetes.io/name: ponyllm
    app.kubernetes.io/component: gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ponyllm
    app.kubernetes.io/component: gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ponyllm-gateway
  namespace: ponyllm
  labels:
    app.kubernetes.io/name: ponyllm
    app.kubernetes.io/component: gateway
  annotations:
    # Keel 自动部署注解：从 force 降级为 minor 语义化保护，杜绝 1m 高频轮询未经验签的盲目滚动
    keel.sh/policy: minor
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 10m"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ponyllm
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ponyllm
        app.kubernetes.io/component: gateway
    spec:
      # 锁定调度到 PV 所在节点，杜绝 RWO PVC 跨节点调度导致的 Multi-Attach / volume affinity 冲突
      nodeSelector:
        kubernetes.io/hostname: devserver
      # 180s 优雅停机窗口：保护 LLM 长文本 / 慢思考（Reasoning）流式连接自然吐完，避免硬杀导致用户端连接被掐断
      terminationGracePeriodSeconds: 180
      # Phase 2：专用最小权限 SA 提供 kube 读/写 ponyllm-live-config 的 token
      # （kube-rs in-cluster 客户端需要挂载 SA token，故 pod 级 automount 打开；
      #  该 pod 只使用 ponyllm-gateway-sa，Role 白名单禁 list/watch/create/delete）
      serviceAccountName: ponyllm-gateway-sa
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: aliyun-registry
      # 注意：initContainer 与主容器共用同一镜像 digest，换镜像时必须同步更新两处
      # （本文件 :60 与 :91）。新镜像才带新 favicon 路由（app.rs）与 ?v=2 的 index.html。
      initContainers:
        - name: init-config-and-snapshot
          image: crpi-3cfwwtc3um8h6d3q.cn-hangzhou.personal.cr.aliyuncs.com/job-copilot/api-v2@sha256:3bfad2f9dd7c7c67ffe66ca524d9e38b3b4c04e286a394cf09b85ec70acbf070
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command:
            - /bin/sh
            - -c
            - |
              set -euo pipefail
              # 解决 PVC 与 Secret 轮转死锁：若配置了 FORCE_CONFIG_SYNC=true 或 PVC 缺损，从只读 Secret 覆写
              # 正常情况：PVC 文件不存在时进行初始化播种；支持 Secret 轮转时优雅同步。
              if [ "${FORCE_CONFIG_SYNC:-0}" = "1" ] || [ ! -f /var/lib/ponyllm/ponyllm.toml ]; then
                cp /etc/ponyllm-ro/ponyllm.toml /var/lib/ponyllm/ponyllm.toml.tmp
                mv -f /var/lib/ponyllm/ponyllm.toml.tmp /var/lib/ponyllm/ponyllm.toml
              fi
              if [ ! -f /var/lib/ponyllm/telemetry-snapshot.json ]; then
                cp /etc/telemetry-init/telemetry-snapshot.json /var/lib/ponyllm/telemetry-snapshot.json.tmp
                mv -f /var/lib/ponyllm/telemetry-snapshot.json.tmp /var/lib/ponyllm/telemetry-snapshot.json
              fi
          volumeMounts:
            - name: config-ro
              mountPath: /etc/ponyllm-ro
            - name: telemetry-init
              mountPath: /etc/telemetry-init
            - name: ponyllm-data
              mountPath: /var/lib/ponyllm
            - name: runtime-data
              mountPath: /tmp
      containers:
        - name: ponyllm
          image: crpi-3cfwwtc3um8h6d3q.cn-hangzhou.personal.cr.aliyuncs.com/job-copilot/api-v2@sha256:3bfad2f9dd7c7c67ffe66ca524d9e38b3b4c04e286a394cf09b85ec70acbf070
          imagePullPolicy: IfNotPresent
          env:
            # Phase 2 锁库（独立 ponyllm-lockdb，TLS=require）：DSN 经 Secret
            # 注入（不进 live-config toml、不落明文）；CA 经 Secret 卷挂载。
            - name: PONYLLM_LOCK_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ponyllm-lock-dsn
                  key: PONYLLM_LOCK_DATABASE_URL
            - name: PONYLLM_LOCK_CA_FILE
              value: /etc/ponyllm-lock/ca.crt
            - name: PONYLLM_LOCK_SSLMODE
              value: "require"
            - name: PONYLLM_PROBE_ALLOWLIST
              value: "pproxy-host.ponyllm.svc,pproxy-host.ponyllm.svc.cluster.local"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # Phase 2：配置真相源为 Secret ponyllm-live-config（kubernetes 后端，
          # 2s 原始字节哈希轮询热更新）；本地文件仅作回滚路径保留。
          command:
            - /usr/local/bin/ponyllm
          args:
            - serve
            - --config-backend=kubernetes
            - --bind
            - 0.0.0.0:8080
          lifecycle:
            preStop:
              exec:
                # 预留 25s 给 IngressRoute / iptables / EndpointSlice 充分收敛剔除旧端点，杜绝新请求路由至已下线 Pod
                # （terminationGracePeriodSeconds 180，preStop 25 < grace，留足主进程 drain 时间）
                command: ["/bin/sh", "-c", "sleep 25"]
          ports:
            - containerPort: 8080
              name: http
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 2000m
              memory: 1024Mi
          volumeMounts:
            - name: lock-tls
              mountPath: /etc/ponyllm-lock
              readOnly: true
            - name: runtime-data
              mountPath: /tmp
            - name: ponyllm-data
              mountPath: /var/lib/ponyllm
            - name: favicon
              mountPath: /opt/ponyllm/web/dist/favicon.svg
              subPath: favicon.svg
              readOnly: true
            - name: favicon
              mountPath: /opt/ponyllm/web/dist/favicon.ico
              subPath: favicon.ico
              readOnly: true
      volumes:
        # Phase 2 播种源 = ponyllm-live-config（159 版本真相；ponyllm-config 已陈旧
        # 仅列为废弃资产）。init 容器仍保留，仅用于 PVC 缺失/强制时的回滚播种。
        - name: config-ro
          secret:
            secretName: ponyllm-live-config
            defaultMode: 256
        # 锁库 TLS 根证书（仅 ca.crt 子路径；server.key 不进入网关）。
        - name: lock-tls
          secret:
            secretName: ponyllm-lock-tls
            defaultMode: 420
            items:
              - key: ca.crt
                path: ca.crt
        - name: ponyllm-data
          persistentVolumeClaim:
            claimName: ponyllm-data
        - name: runtime-data
          emptyDir:
            sizeLimit: 256Mi
        - name: favicon
          configMap:
            # 清单见 deploy/ponyllm-favicon.yaml（生成于 scripts/gen-favicon.sh）。
            # 部署顺序：先 apply 该 ConfigMap，再 apply 本 Deployment；subPath 挂载
            # 不随 ConfigMap 更新热生效，改图标后需滚动重启本 Deployment。
            name: ponyllm-favicon
            defaultMode: 292
        - name: telemetry-init
          secret:
            secretName: ponyllm-telemetry-snapshot
            defaultMode: 256
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ponyllm-data
  namespace: ponyllm
  labels:
    app.kubernetes.io/name: ponyllm
    app.kubernetes.io/component: gateway
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
