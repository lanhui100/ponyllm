apiVersion: v1
kind: Service
metadata:
  name: egress-home-pool
  namespace: ponyllm
  labels:
    app.kubernetes.io/name: egress-home-pool
    app.kubernetes.io/component: egress
spec:
  ports:
    - name: http-proxy
      port: 8899
      targetPort: 8899
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: egress-home-pool
  namespace: ponyllm
  labels:
    app.kubernetes.io/name: egress-home-pool
    app.kubernetes.io/component: egress
subsets:
  - addresses:
      - ip: 100.95.193.103
    ports:
      - name: http-proxy
        port: 8899
        protocol: TCP
