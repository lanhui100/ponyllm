# CI 部署身份（GitOps deploy job 使用）——最小权限：
#   仅 ponyllm 命名空间内 deployments/services 的读写 + pods 只读（rollout 状态）。
#   无 secrets/configmaps 读取、无跨命名空间权限。
#   + 集群级 nodes 只读（get/list）：发布前必须判定目标节点 Ready/可调度/无阻塞污点。
# 凭据形态：ServiceAccount + 长期 token Secret；kubeconfig 由运维导出后
# base64 存入 GitHub Secrets（KUBECONFIG_BASE64），不经本清单落盘。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-deployer
  namespace: ponyllm
---
# 2026-10-14 事故修复：serialized-rollout.sh / check-cluster-image-parity.sh 都需要
# `kubectl get node(s)`。缺失该权限时 403 被脚本 `2>/dev/null` 吞掉，误判为"节点不存在"，
# 导致 4 个 role 全部跳过 apply（发布空跑）且一致性门禁以 0 个 Pod 判定 PASS（假放行）。
# 该 ClusterRole 仅授予只读 get/list，不涉及任何写操作。
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ponyllm-ci-deployer-node-reader
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ponyllm-ci-deployer-node-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ponyllm-ci-deployer-node-reader
subjects:
  - kind: ServiceAccount
    name: ci-deployer
    namespace: ponyllm
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ci-deployer
  namespace: ponyllm
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # 2026-09-30 加权部署后 apply 需同时下发 IngressRoute/TLSOption/Middleware
  # 与 Certificate（见 deploy/ponyllm-ingress-routes.yaml）
  - apiGroups: ["traefik.io"]
    resources: ["ingressroutes", "tlsoptions", "middlewares"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # 2026-10-01 单写者 PVC 持久化（deploy/ponyllm-deployment.yaml 含 PVC 对象）
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-deployer
  namespace: ponyllm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ci-deployer
subjects:
  - kind: ServiceAccount
    name: ci-deployer
    namespace: ponyllm
---
apiVersion: v1
kind: Secret
metadata:
  name: ci-deployer-token
  namespace: ponyllm
  annotations:
    kubernetes.io/service-account.name: ci-deployer
type: kubernetes.io/service-account.token
