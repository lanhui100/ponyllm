apiVersion: apps/v1
kind: Deployment
metadata:
  name: ponyllm-synthetic-prober
  namespace: ponyllm
  labels:
    app.kubernetes.io/name: ponyllm
    app.kubernetes.io/component: synthetic-prober
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ponyllm
      app.kubernetes.io/component: synthetic-prober
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ponyllm
        app.kubernetes.io/component: synthetic-prober
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prober
          image: crpi-3cfwwtc3um8h6d3q.cn-hangzhou.personal.cr.aliyuncs.com/job-copilot/api-v2@sha256:f5e68cfa52ae97f8e01546aa9ae7cd01ac1c0b17bca2f6abb02a7174469cea66
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: PROBE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ponyllm-probe-credentials
                  key: api-key
            - name: PROBE_MGMT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ponyllm-probe-credentials
                  key: mgmt-token
                  optional: true
            # 2026-09-30：探针目标从 deepseek-flash（直连）改为 mimo-v2.5-free
            # （opencode-zen / pproxy 出海链路），覆盖此前 muse/gemini 那类路径。
            # PROBE_TIMEOUT=90 对齐网关 90s TTFB 预算（opencode-zen 首 token
            # 实测 10~40s，10s 默认会误报）。
            - name: PROBE_MODEL
              value: mimo-v2.5-free
            - name: PROBE_TIMEOUT
              value: "90"
            # 2026-10-03：免费额度探针降频 30s -> 600s。事故复盘（req_18daf7d30e…）：
            # 探针每 30s 打一次 opencode-zen 免费额度模型，叠加真实流量把 Console
            # 免费窗口打爆（FreeUsageLimitError 429），网关把三把 zen key 全部冷却
            # （5m→2h 指数升级），全池无可用 key -> 生产请求本地 429。免费额度是
            # 共享滑动窗口，30s 主动探测等于持续消耗额度；降频至 10min 保留链路
            # 存活探测又不挖洞（一次失败冷却在下次探测前已过期）。脚本默认仍为 30s，
            # 由本 Deployment 显式覆盖。
            - name: PROBE_INTERVAL_SECONDS
              value: "600"
            # 契约 C3：长流连续性探针配置（默认关闭：长流按需由 CI 门禁单发启用，常开会持续消耗上游配额）
            - name: PROBE_LONG_STREAM
              value: "0"
            - name: PROBE_LONG_STREAM_INTERVAL_SECONDS
              value: "600"
            - name: PROBE_LONG_STREAM_SECONDS
              value: "120"
            - name: PROBE_LONG_STREAM_MODEL
              value: mimo-v2.5-free
          command: ["python3", "/opt/prober/prober.py"]
          ports:
            - containerPort: 9115
              name: metrics
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              # 契约 C3 评估：上调至 256Mi 支持长流连续性探测（SSE 多分块缓冲），防止长时间长流内存暴涨触发 OOMKilled
              memory: 256Mi
          volumeMounts:
            - name: script
              mountPath: /opt/prober
            - name: runtime-data
              mountPath: /tmp
      volumes:
        - name: script
          configMap:
            name: ponyllm-prober-script
        - name: runtime-data
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ponyllm-synthetic-prober
  namespace: ponyllm
  labels:
    app.kubernetes.io/name: ponyllm
    app.kubernetes.io/component: synthetic-prober
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ponyllm
    app.kubernetes.io/component: synthetic-prober
  ports:
    - name: metrics
      port: 9115
      targetPort: 9115
      protocol: TCP
