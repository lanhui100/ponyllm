apiVersion: apps/v1
kind: Deployment
metadata:
  name: ponyllm-synthetic-prober
  namespace: ponyllm
  labels:
    app.kubernetes.io/name: ponyllm
    app.kubernetes.io/component: synthetic-prober
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ponyllm
      app.kubernetes.io/component: synthetic-prober
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ponyllm
        app.kubernetes.io/component: synthetic-prober
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prober
          image: crpi-3cfwwtc3um8h6d3q.cn-hangzhou.personal.cr.aliyuncs.com/job-copilot/api-v2@sha256:f5e68cfa52ae97f8e01546aa9ae7cd01ac1c0b17bca2f6abb02a7174469cea66
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: PROBE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ponyllm-probe-credentials
                  key: api-key
            - name: PROBE_MGMT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ponyllm-probe-credentials
                  key: mgmt-token
                  optional: true
            # 2026-10-15：探针基准模型恢复为稳定直连的 deepseek-flash（高可用低延迟）；
            # 避免受上游免费额度风控与频控干扰导致全网关存活状态误报。
            - name: PROBE_MODEL
              value: deepseek-flash
            - name: PROBE_TIMEOUT
              value: "90"
            - name: PROBE_INTERVAL_SECONDS
              value: "30"
            # 契约 C3：长流连续性探针配置（默认关闭：长流按需由 CI 门禁单发启用，常开会持续消耗上游配额）
            - name: PROBE_LONG_STREAM
              value: "0"
            - name: PROBE_LONG_STREAM_INTERVAL_SECONDS
              value: "600"
            - name: PROBE_LONG_STREAM_SECONDS
              value: "120"
            - name: PROBE_LONG_STREAM_MODEL
              value: deepseek-flash
          command: ["python3", "/opt/prober/prober.py"]
          ports:
            - containerPort: 9115
              name: metrics
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              # 契约 C3 评估：上调至 256Mi 支持长流连续性探测（SSE 多分块缓冲），防止长时间长流内存暴涨触发 OOMKilled
              memory: 256Mi
          volumeMounts:
            - name: script
              mountPath: /opt/prober
            - name: runtime-data
              mountPath: /tmp
      volumes:
        - name: script
          configMap:
            name: ponyllm-prober-script
        - name: runtime-data
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ponyllm-synthetic-prober
  namespace: ponyllm
  labels:
    app.kubernetes.io/name: ponyllm
    app.kubernetes.io/component: synthetic-prober
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ponyllm
    app.kubernetes.io/component: synthetic-prober
  ports:
    - name: metrics
      port: 9115
      targetPort: 9115
      protocol: TCP
