apiVersion: v1
kind: Service
metadata:
  name: ponyllm-pod-service
  namespace: ponyllm
  labels:
    app.kubernetes.io/name: ponyllm
    app.kubernetes.io/component: gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ponyllm
    app.kubernetes.io/component: gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ponyllm-gateway
  namespace: ponyllm
  labels:
    app.kubernetes.io/name: ponyllm
    app.kubernetes.io/component: gateway
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ponyllm
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ponyllm
        app.kubernetes.io/component: gateway
    spec:
      # 60s 足够排空多数在途请求；长请求（upstream_timeout 1200s）会被截断，
      # 由客户端重试兜底。360s 曾因 Recreate 导致每次重启业务中断 3-6 分钟。
      terminationGracePeriodSeconds: 60
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: aliyun-registry
      initContainers:
        - name: init-config-and-snapshot
          image: crpi-3cfwwtc3um8h6d3q.cn-hangzhou.personal.cr.aliyuncs.com/job-copilot/api-v2@sha256:932c410e8898948e29b67d82548f77f8255bfd80bed65fa26d9a2be572fb4258
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command:
            - /bin/sh
            - -c
            - |
              # Seed config only when absent: /var/lib/ponyllm now persists on a PVC,
              # so admin/web writes (key delete, provider edits, token rotation) must
              # survive pod restarts instead of being re-copied from the Secret.
              if [ ! -f /var/lib/ponyllm/ponyllm.toml ]; then
                cp /etc/ponyllm-ro/ponyllm.toml /var/lib/ponyllm/ponyllm.toml 2>/dev/null || true
              fi
              if [ ! -f /var/lib/ponyllm/telemetry-snapshot.json ]; then
                cp /etc/telemetry-init/telemetry-snapshot.json /var/lib/ponyllm/telemetry-snapshot.json 2>/dev/null || true
              fi
          volumeMounts:
            - name: config-ro
              mountPath: /etc/ponyllm-ro
            - name: telemetry-init
              mountPath: /etc/telemetry-init
            - name: ponyllm-data
              mountPath: /var/lib/ponyllm
            - name: runtime-data
              mountPath: /tmp
      containers:
        - name: ponyllm
          image: crpi-3cfwwtc3um8h6d3q.cn-hangzhou.personal.cr.aliyuncs.com/job-copilot/api-v2@sha256:932c410e8898948e29b67d82548f77f8255bfd80bed65fa26d9a2be572fb4258
          imagePullPolicy: IfNotPresent
          env:
            - name: PONYLLM_PROBE_ALLOWLIST
              value: "pproxy-host.ponyllm.svc,pproxy-host.ponyllm.svc.cluster.local"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command:
            - /usr/local/bin/ponyllm
            - serve
            - --bind
            - 0.0.0.0:8080
            - --config
            - /var/lib/ponyllm/ponyllm.toml
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          volumeMounts:
            - name: runtime-data
              mountPath: /tmp
            - name: ponyllm-data
              mountPath: /var/lib/ponyllm
            - name: favicon
              mountPath: /opt/ponyllm/web/dist/favicon.svg
              subPath: favicon.svg
              readOnly: true
            - name: favicon
              mountPath: /opt/ponyllm/web/dist/favicon.ico
              subPath: favicon.ico
              readOnly: true
      volumes:
        - name: config-ro
          secret:
            secretName: ponyllm-config
            defaultMode: 256
        - name: ponyllm-data
          persistentVolumeClaim:
            claimName: ponyllm-data
        - name: runtime-data
          emptyDir: {}
        - name: favicon
          configMap:
            name: ponyllm-favicon
            defaultMode: 292
        - name: telemetry-init
          secret:
            secretName: ponyllm-telemetry-snapshot
            defaultMode: 256
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ponyllm-data
  namespace: ponyllm
  labels:
    app.kubernetes.io/name: ponyllm
    app.kubernetes.io/component: gateway
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
