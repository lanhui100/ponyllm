apiVersion: apps/v1
kind: Deployment
metadata:
  name: ponyllm-gateway-dev
  namespace: ponyllm
  labels:
    app.kubernetes.io/name: ponyllm
    app.kubernetes.io/component: gateway
    ponyllm.io/node-role: dev
  annotations:
    # 部署机制：CI deploy job 驱动 —— 镜像推送后由 CI 把 registry digest 钉入
    # 本清单（[skip ci] commit-back，清单即真相）并 kubectl apply；确定性零停机
    # 滚动（maxUnavailable:0 / maxSurge:1 + /health 就绪探针）。曾试用 Keel
    # `latest`+force 自动滚动，实证不可靠（相同标签不产生 spec 变更 +
    # IfNotPresent 节点缓存旧 digest → 混合版本），已移除 Keel 注解。
    # 回滚：kubectl rollout undo（revisionHistoryLimit:3）。
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ponyllm
      app.kubernetes.io/component: gateway
      ponyllm.io/node-role: dev
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ponyllm
        app.kubernetes.io/component: gateway
        ponyllm.io/node-role: dev
    spec:
      # 单副本节点绑定：按 handover 5:4:1:1 加权，各节点 1 个 gateway。
      nodeSelector:
        kubernetes.io/hostname: devserver
      # 180s 优雅停机窗口：保护 LLM 长文本 / 慢思考（Reasoning）流式连接自然吐完，避免硬杀导致用户端连接被掐断
      terminationGracePeriodSeconds: 180
      serviceAccountName: ponyllm-gateway-sa
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: aliyun-registry
      containers:
        - name: ponyllm
          image: crpi-3cfwwtc3um8h6d3q.cn-hangzhou.personal.cr.aliyuncs.com/job-copilot/api-v2@sha256:cd8dd928ffbf19e7692afa0b0d281d72f527ebca14d267b7662f77302fb83e37
          imagePullPolicy: IfNotPresent
          env:
            # 锁库（独立 ponyllm-lockdb，TLS=require）DSN 经 Secret 注入
            # （不落明文）；CA 经 Secret 卷挂载。
            - name: PONYLLM_LOCK_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ponyllm-lock-dsn
                  key: PONYLLM_LOCK_DATABASE_URL
            - name: PONYLLM_LOCK_CA_FILE
              value: /etc/ponyllm-lock/ca.crt
            - name: PONYLLM_LOCK_SSLMODE
              value: "require"
            - name: PONYLLM_PROBE_ALLOWLIST
              value: "pproxy-host.ponyllm.svc,pproxy-host.ponyllm.svc.cluster.local"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # 配置真相源 = Secret ponyllm-live-config（kubernetes 后端，
          # 2s 原始字节哈希轮询热更新）。
          command:
            - /usr/local/bin/ponyllm
          args:
            - serve
            - --config-backend=kubernetes
            - --bind
            - 0.0.0.0:8080
          lifecycle:
            preStop:
              exec:
                # 预留 25s 给 IngressRoute / iptables / EndpointSlice 充分收敛剔除旧端点，杜绝新请求路由至已下线 Pod
                # （terminationGracePeriodSeconds 180，preStop 25 < grace；主进程另有 60s drain 超时）
                command: ["/bin/sh", "-c", "sleep 25"]
          ports:
            - containerPort: 8080
              name: http
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 2000m
              memory: 1024Mi
          volumeMounts:
            - name: lock-tls
              mountPath: /etc/ponyllm-lock
              readOnly: true
            - name: runtime-data
              mountPath: /tmp
            # telemetry-snapshot 落盘为每副本 emptyDir（无共享可写状态；重启即失）。
            - name: ponyllm-state
              mountPath: /var/lib/ponyllm
            - name: favicon
              mountPath: /opt/ponyllm/web/dist/favicon.svg
              subPath: favicon.svg
              readOnly: true
            - name: favicon
              mountPath: /opt/ponyllm/web/dist/favicon.ico
              subPath: favicon.ico
              readOnly: true
      volumes:
        # 锁库 TLS 根证书（仅 ca.crt 子路径）。
        - name: lock-tls
          secret:
            secretName: ponyllm-lock-tls
            defaultMode: 420
            items:
              - key: ca.crt
                path: ca.crt
        - name: runtime-data
          emptyDir:
            sizeLimit: 256Mi
        - name: ponyllm-state
          emptyDir:
            sizeLimit: 64Mi
        - name: favicon
          configMap:
            # 清单见 deploy/ponyllm-favicon.yaml（生成于 scripts/gen-favicon.sh）。
            # 部署顺序：先 apply 该 ConfigMap，再 apply 本 Deployment；subPath 挂载
            # 不随 ConfigMap 更新热生效，改图标后需滚动重启本 Deployment。
            name: ponyllm-favicon
            defaultMode: 292
---
