# ponyllm-gateway — 加权多节点部署（4 节点绑定 Deployment，Traefik 5:4:1:1 加权）
#
# ============================================================================
# 架构（2026-09-30，ADR：.agents/notes/implemented/architecture/2026-09-30-*）：
#   1. 4 个 Deployment 各 1 replica，nodeSelector 绑定节点（devserver /
#      jobcopilot-preprod / proserver / tencent），以 ponyllm.io/node-role
#      区分；Traefik IngressRoute（deploy/ponyllm-ingress-routes.yaml）按
#      weight 5:4:1:1 加权分发。
#   2. Fallback：readinessProbe(/health) 摘除不健康 Pod → Traefik 自动将该
#      Service weight 归零，剩余 Service 按比例重分配（非显式 failover）。
#   3. ponyllm-pod-service 保留为聚合 Service（覆盖全部 4 个 Pod，供
#      admin/内部流量等非加权场景）。
# 部署机制：CI deploy job 直接驱动 —— 镜像推送后 sed 把 registry digest 钉入
#   本清单（4 个 image 行，[skip ci] commit-back，清单即真相）并 kubectl apply。
# 回滚：恢复 1 Deployment 4 replicas + 原 IngressRoute 后 kubectl apply；
#   revisionHistoryLimit: 3 保留历史。
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: ponyllm-pod-service
  namespace: ponyllm
  labels:
    app.kubernetes.io/name: ponyllm
    app.kubernetes.io/component: gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ponyllm
    app.kubernetes.io/component: gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
---
