apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ponyllm-security-headers
  namespace: ponyllm
  labels:
    app.kubernetes.io/name: ponyllm
spec:
  headers:
    customResponseHeaders:
      Strict-Transport-Security: max-age=31536000; includeSubDomains; preload
      # CSP 加固：移除 script-src 'unsafe-inline'，严禁内联脚本执行；
      # 允许 style-src 'self' 'unsafe-inline' 仅供 Tailwind/Vue scoped 动态样式插入；
      # img-src 收窄为 'self' data: 杜绝图片加载外带凭据；
      # connect-src 收敛为 'self' 同源；补充 form-action 'self' 防表单劫持；
      # upgrade-insecure-requests：全站 HTTPS，杜绝任何降级明文子资源。
      Content-Security-Policy: >-
        default-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self';
        script-src 'self'; style-src 'self' 'unsafe-inline'; upgrade-insecure-requests;
        img-src 'self' data:; font-src 'self' data:;
        connect-src 'self';
      # 跨源隔离（VULN-10）：CORP/COOP same-origin 阻断跨源资源嵌入与窗口接管；
      # 本站 OAuth 弹窗与父页同源，COOP same-origin 不阻断同源窗口通信。
      Cross-Origin-Resource-Policy: same-origin
      Cross-Origin-Opener-Policy: same-origin
      # permissions-policy 与应用层 app.rs 默认值对齐，补 payment=()。
      Permissions-Policy: geolocation=(), microphone=(), camera=(), payment=()
      Referrer-Policy: no-referrer
      X-Content-Type-Options: nosniff
      X-Frame-Options: SAMEORIGIN
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ponyllm-https-redirect
  namespace: ponyllm
  labels:
    app.kubernetes.io/name: ponyllm
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
# 受权管理接口边缘粗筛：仅运维出口可达，身份鉴权仍由后端 auth_middleware 负责。
# sourceRange 为占位（TEST-NET-1 文档段），需运维填入真实运维出口 IP/CIDR 后再生效。
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ponyllm-admin-allowlist
  namespace: ponyllm
  labels:
    app.kubernetes.io/name: ponyllm
spec:
  ipAllowList:
    sourceRange:
      - 0.0.0.0/0 # 默认全网放行至后端 auth_middleware 鉴权；如需限制运维出口，请在此填入运维 CIDR
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ponyllm-ratelimit
  namespace: ponyllm
  labels:
    app.kubernetes.io/name: ponyllm
spec:
  rateLimit:
    average: 120
    burst: 60
    sourceCriterion:
      ipStrategy:
        # EdgeOne 双层代理说明：经 EdgeOne 回源后 Traefik 看到的通常是 EdgeOne
        # 边缘节点 IP，直连 depth:1 会把限流键算到代理 IP 上（误伤/误放）。
        # 正确做法是在 Traefik 静态配置补 trustedIPs（EdgeOne 回源段）+ depth:2，
        # 取 X-Forwarded-For 倒数第 2 跳的真实客户端 IP。本文件为 Middleware CRD，
        # 配不了静态 trustedIPs，故此处保持 depth:1 不动，由运维在 Traefik 层补齐。
        depth: 1
---
# 针对敏感管理路径与未认证探测的收紧限流（防暴力破解与高频扫描）
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ponyllm-admin-ratelimit
  namespace: ponyllm
  labels:
    app.kubernetes.io/name: ponyllm
spec:
  rateLimit:
    average: 20
    burst: 10
    sourceCriterion:
      ipStrategy:
        # 与全局限流一致：接入 CDN（如 EdgeOne）后，运维应在 Traefik 静态配置配置
        # trustedIPs（回源 IP 段）并将 depth 设为 2，以准确提取客户端真实 IP 限流。
        depth: 1
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ponyllm-inflightreq
  namespace: ponyllm
  labels:
    app.kubernetes.io/name: ponyllm
spec:
  inFlightReq:
    # 对抗审核裁决：从 30 适度收敛提升至 60（规避 EdgeOne 少数回源节点聚合打满，同时防止单 Pod OOM 击穿）
    amount: 60
    sourceCriterion:
      ipStrategy:
        # 同上：EdgeOne 双层代理下需 Traefik 静态 trustedIPs + depth:2；
        # 静态配置需运维在 Traefik 层补，不在本文件改，此处保持 depth:1。
        depth: 1
