# C2: IngressRoute split for tokens.ponyjob.top (redirect-safe).
#
# The existing Ingress ponyllm/ponyllm-ingress serves web+websecure on ONE
# router, so attaching redirectScheme there would loop. These two
# IngressRoutes replace it functionally:
#   - ponyllm-http: web entrypoint only + https-redirect middleware
#   - ponyllm-https: websecure only + security-headers middleware + TLS
#
# Cutover (rollback = delete these two files' objects, Ingress keeps working):
#   1. kubectl apply -f this file   (alongside the existing Ingress — no conflict:
#      IngressRoute and Ingress are separate router sources; the more specific
#      host+entrypoint match wins deterministically per entrypoint)
#   2. verify redirect + headers (commands in deploy/ponyllm-ingress-hardening.yaml)
#   3. only then, optionally remove `web` from the Ingress entrypoints
#      annotation (leaving websecure-only Ingress as a second anchor).
#
# NOTE (C2 acceptance P0): the old Ingress carried the
# `cert-manager.io/cluster-issuer` annotation — the sole renewal trigger
# (ingress-shim). It is deleted, so renewal now rests on the explicit
# Certificate below (decoupled, permanent). Verify with
# `kubectl get certificate -n ponyllm` READY=True.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: tokens-ponyjob-top-tls
  namespace: ponyllm
  labels:
    app.kubernetes.io/name: ponyllm
spec:
  secretName: tokens-ponyjob-top-tls
  dnsNames:
    - tokens.ponyjob.top
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  duration: 2160h # 90d，与 letsencrypt-prod 90 天签发周期对齐
  renewBefore: 720h # 30d，提前 30 天续期
  privateKey:
    algorithm: ECDSA
    size: 384
    rotationPolicy: Always
  revisionHistoryLimit: 3
---
# TLS 安全基线：强制 TLS1.2+、SNI 严格校验，仅保留 ECDHE+AEAD/PFS 套件。
# 由 ponyllm-https IngressRoute tls.options 引用。
apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: ponyllm-tls-opts
  namespace: ponyllm
  labels:
    app.kubernetes.io/name: ponyllm
spec:
  minVersion: VersionTLS12
  sniStrict: true
  cipherSuites:
    - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
    - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
    - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
    - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
    - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305
    - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ponyllm-http
  namespace: ponyllm
  labels:
    app.kubernetes.io/name: ponyllm
spec:
  entryPoints:
    - web
  routes:
    # 1. 显式放行 ACME HTTP-01 Challenge，直通有效容器服务，绝不跳转 HTTPS，绝不挂载安全校验中间件
    #    挂 ratelimit 防 Challenge 路径被扫刷爆后端（不挂 redirect/security-headers，避免影响签发）。
    - match: Host(`tokens.ponyjob.top`) && PathPrefix(`/.well-known/acme-challenge/`)
      kind: Rule
      middlewares:
        - name: ponyllm-ratelimit
      services:
        - name: ponyllm-pod-service
          port: 8080
          # 主动探活（阶段3）：Traefik 原生 L7 探针直连 Pod /health，与 kubelet
          # 就绪探针解耦 —— 控制面宕机时 kubelet 无法更新 endpoints，边缘仍可
          # 在 interval+timeout(≈3s) 内自发切除失效端点，前端不卡死。
          healthCheck:
            path: /health
            intervalSeconds: 2
            timeoutSeconds: 1
    # 2. 其他全部 HTTP 流量强制 301/308 跳转 HTTPS
    - match: Host(`tokens.ponyjob.top`)
      kind: Rule
      middlewares:
        - name: ponyllm-https-redirect
      services:
        - name: ponyllm-pod-service
          port: 8080
          healthCheck:
            path: /health
            intervalSeconds: 2
            timeoutSeconds: 1
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ponyllm-https
  namespace: ponyllm
  labels:
    app.kubernetes.io/name: ponyllm
spec:
  entryPoints:
    - websecure
  routes:
    # 加权数据面（2026-09-30）：路由 #2/#3/#4 按 dev:preprod:proserver:tencent
    # = 5:4:1:1 加权分发（weight 为相对值）。fallback：readinessProbe(/health)
    # 摘除不健康 Pod → Traefik 自动将该 Service weight 归零，剩余 Service 按
    # 比例重分配（非显式 failover，如实声明）。
    # 1. 显式放行 ACME HTTP-01/TLS Challenge 直通有效容器服务
    #    挂 ratelimit + security-headers：限流防扫刷，安全头与全站一致。
    - match: Host(`tokens.ponyjob.top`) && PathPrefix(`/.well-known/acme-challenge/`)
      kind: Rule
      middlewares:
        - name: ponyllm-security-headers
        - name: ponyllm-ratelimit
      services:
        - name: ponyllm-pod-service
          port: 8080
          healthCheck:
            path: /health
            intervalSeconds: 2
            timeoutSeconds: 1
    # 2. Web 控制台静态页面（挂载安全响应头，防点击劫持与 MIME 嗅探）
    #    精确匹配收敛：Path(`/x`)+PathPrefix(`/x/`) 组合，杜绝 PathPrefix(`/app`) 对
    #    /app-evil、/assets-evil 类路径的过匹配。
    - match: Host(`tokens.ponyjob.top`) && (Path(`/`) || Path(`/app`) || PathPrefix(`/app/`) || Path(`/assets`) || PathPrefix(`/assets/`) || Path(`/connect`) || Path(`/dashboard`) || Path(`/recorder`) || Path(`/governance`) || Path(`/tokens`) || Path(`/users`) || Path(`/favicon.svg`) || Path(`/favicon.ico`))
      kind: Rule
      middlewares:
        - name: ponyllm-security-headers
      services:
        - name: ponyllm-svc-dev
          port: 8080
          weight: 5
          healthCheck:
            path: /health
            intervalSeconds: 2
            timeoutSeconds: 1
          responseForwarding:
            flushInterval: "100ms"
        - name: ponyllm-svc-preprod
          port: 8080
          weight: 4
          healthCheck:
            path: /health
            intervalSeconds: 2
            timeoutSeconds: 1
          responseForwarding:
            flushInterval: "100ms"
        - name: ponyllm-svc-proserver
          port: 8080
          weight: 1
          healthCheck:
            path: /health
            intervalSeconds: 2
            timeoutSeconds: 1
          responseForwarding:
            flushInterval: "100ms"
        - name: ponyllm-svc-tencent
          port: 8080
          weight: 1
          healthCheck:
            path: /health
            intervalSeconds: 2
            timeoutSeconds: 1
          responseForwarding:
            flushInterval: "100ms"
    # 3. 核心白名单：业务数据面、探活（全部由后端 auth_middleware 鉴权）
    #    精确匹配收敛：Path(`/x`)+PathPrefix(`/x/`) 组合，杜绝 PathPrefix(`/models`)
    #    对 /models-evil、/messages-evil、/responses-evil 类路径的过匹配。
    #    /api/admin/ 与 /v1/telemetry/ 已拆至独立单写者路由，不在此加权分发。
    - match: Host(`tokens.ponyjob.top`) && (PathPrefix(`/v1/`) || Path(`/health`) || Path(`/models`) || PathPrefix(`/models/`) || Path(`/messages`) || PathPrefix(`/messages/`) || Path(`/responses`) || PathPrefix(`/responses/`) || Path(`/api/user`) || PathPrefix(`/api/user/`))
      kind: Rule
      middlewares:
        - name: ponyllm-security-headers
        - name: ponyllm-ratelimit
        - name: ponyllm-inflightreq
      services:
        - name: ponyllm-svc-dev
          port: 8080
          weight: 5
          healthCheck:
            path: /health
            intervalSeconds: 2
            timeoutSeconds: 1
          responseForwarding:
            flushInterval: "100ms"
        - name: ponyllm-svc-preprod
          port: 8080
          weight: 4
          healthCheck:
            path: /health
            intervalSeconds: 2
            timeoutSeconds: 1
          responseForwarding:
            flushInterval: "100ms"
        - name: ponyllm-svc-proserver
          port: 8080
          weight: 1
          healthCheck:
            path: /health
            intervalSeconds: 2
            timeoutSeconds: 1
          responseForwarding:
            flushInterval: "100ms"
        - name: ponyllm-svc-tencent
          port: 8080
          weight: 1
          healthCheck:
            path: /health
            intervalSeconds: 2
            timeoutSeconds: 1
          responseForwarding:
            flushInterval: "100ms"
    # 4. 遥测观测独立路由（2026-10-02 全集群观测）：
    #    - 全集群指标汇总接口 (/v1/telemetry/metrics, /v1/telemetry/history) 依赖 PostgreSQL 全局聚合底座，支持多副本加权分发；
    #    - 实时流/提供商状态接口 (/v1/telemetry/stream) 包含 Pod 内存本地的连通性微柱 (ConnectivityBars) 与实时流状态，
    #      收敛至单写者 dev 副本响应，从边缘彻底消除微柱与提供商状态频闪跳变。
    - match: Host(`tokens.ponyjob.top`) && (Path(`/v1/telemetry/stream`) || Path(`/telemetry/stream`))
      kind: Rule
      priority: 600
      middlewares:
        - name: ponyllm-security-headers
        - name: ponyllm-ratelimit
        - name: ponyllm-inflightreq
      services:
        - name: ponyllm-svc-dev
          port: 8080
          weight: 5
          healthCheck:
            path: /health
            intervalSeconds: 2
            timeoutSeconds: 1
          responseForwarding:
            flushInterval: "100ms"
    - match: Host(`tokens.ponyjob.top`) && (Path(`/v1/telemetry`) || PathPrefix(`/v1/telemetry/`) || Path(`/telemetry`) || PathPrefix(`/telemetry/`))
      kind: Rule
      priority: 500
      middlewares:
        - name: ponyllm-security-headers
        - name: ponyllm-ratelimit
        - name: ponyllm-inflightreq
      services:
        - name: ponyllm-svc-dev
          port: 8080
          weight: 5
          healthCheck:
            path: /health
            intervalSeconds: 2
            timeoutSeconds: 1
          responseForwarding:
            flushInterval: "100ms"
        - name: ponyllm-svc-preprod
          port: 8080
          weight: 4
          healthCheck:
            path: /health
            intervalSeconds: 2
            timeoutSeconds: 1
          responseForwarding:
            flushInterval: "100ms"
        - name: ponyllm-svc-proserver
          port: 8080
          weight: 1
          healthCheck:
            path: /health
            intervalSeconds: 2
            timeoutSeconds: 1
          responseForwarding:
            flushInterval: "100ms"
        - name: ponyllm-svc-tencent
          port: 8080
          weight: 1
          healthCheck:
            path: /health
            intervalSeconds: 2
            timeoutSeconds: 1
          responseForwarding:
            flushInterval: "100ms"
    # 5. 受权管理接口独立路由：边缘只做 IPAllowList 粗筛，身份鉴权仍由后端 auth_middleware 负责。
    #    sourceRange 为占位，需运维填入真实运维出口 IP/CIDR 后再生效。
    - match: Host(`tokens.ponyjob.top`) && (Path(`/api/admin`) || PathPrefix(`/api/admin/`))
      kind: Rule
      # dashboard telemetry 单写者（2026-10-01 ADR）：admin 面钉死 dev 副本，
      # 其 /var/lib/ponyllm 挂既有 PVC ponyllm-data，dashboard 读写同副本、
      # 跨发版持久。数据面 /v1/* 路由仍 5:4:1:1 加权，不受影响。
      # 2026-10-06 F16：补挂专用 admin-ratelimit（20/10，比全局 120/60 更严），
      # 防管理面撞库/扫号；与全局 ratelimit 链式叠加计数。
      middlewares:
        - name: ponyllm-security-headers
        - name: ponyllm-admin-allowlist
        - name: ponyllm-admin-ratelimit
        - name: ponyllm-ratelimit
        - name: ponyllm-inflightreq
      services:
        - name: ponyllm-svc-dev
          port: 8080
          weight: 5
          # 管理面同样主动探活：Pod 失效时边缘在 ~3s 内隔离，dashboard 不卡死。
          healthCheck:
            path: /health
            intervalSeconds: 2
            timeoutSeconds: 1
          responseForwarding:
            flushInterval: "100ms"
    # 注意（边缘行为如实声明，修正旧注释的失实表述）：
    # - 未命中上述路由的其他路径由 Traefik 默认返回 404，不透传后端。
    # - 但 /v1/telemetry/*（命中独立路由 #4）与 /api/admin/*（命中独立路由 #5）
    #   是显式放行的，鉴权完全依赖后端 auth_middleware，边缘只做路由+限流/IPAllowList，
    #   不做身份校验，更不对这两类路径做 404。
    # - 文档漂移点同步声明：旧注释曾写“/api/admin/*、/v1/telemetry/* 及未授权目录默认 404”，
    #   与实际路由相悖，系虚假安全感，已按本注释为准修正。
  tls:
    secretName: tokens-ponyjob-top-tls
    options:
      name: ponyllm-tls-opts
      namespace: ponyllm
