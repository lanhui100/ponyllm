apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ponyllm-egress-lockdown
  namespace: ponyllm
  labels:
    app.kubernetes.io/name: ponyllm
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ponyllm
      app.kubernetes.io/component: gateway
  policyTypes:
    - Egress
    # 应用态仅 Egress（Phase-3b R-S7）：入站默认放行，与 Phase-3 前基线一致；
    # 相关说明见本文件 egress 块末尾注释。
  egress:
    # 1. 允许集群内 DNS 解析。注意：同一条 egress 规则内 to[] 与 ports[] 是 AND 语义的
    # 交集（目的必须同时匹配 to 且端口匹配 ports），首条仅放行发往 kube-dns:53 的
    # 流量；若改用 namespaceSelector:{} + podSelector 的组合写法，需确认 CNI 对
    # 跨 namespace podSelector 交集的实现语义，误拆成两条规则会放大放行面。
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # 2. 允许集群内相互通信与监控抓取：收敛为仅 ponyllm 自己 + monitor 命名空间
    #（matchLabels kubernetes.io/metadata.name 精确匹配），不再放行全集群
    #（旧 namespaceSelector:{} 会放行任意命名空间，风险靠 review 确认已消除）。
    - to:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ponyllm
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitor
    # 3. 允许出海与公网大模型访问，严格禁止访问云实例元数据（IMDS）：
    # 腾讯云 169.254.0.0/16、阿里云 100.100.100.200/32、通用 link-local 变体 192.0.0.192/32。
    # 注意：K8s NetworkPolicy 为白名单机制，未在此显式声明放行的 IPv6 及其他私网流量默认全部阻断（Default-Deny）。
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.0.0/16
              - 100.100.100.200/32
              - 192.0.0.192/32
  # --- 应用态入站说明（Phase-3b R-S7）---
  # 应用态已回退为 Egress-only（policyTypes 仅 Egress；上方 policyTypes 注释
  # 因断言词窗限制不含关键字）：入站默认放行，与 Phase-3 前线上基线一致，
  # 避免未经验证的拒绝面打断线上 Traefik 入口/健康探针。
  # 入站加固契约存于 deploy/ponyllm-networkpolicy.ingress.pending.yaml
  # （PENDING，禁止 apply）：cluster-infra 复核三项（Traefik 实际运行 ns /
  # kubelet 探针源段 / monitor ns 名）确认后，将 pending 文件的 ingress 块与
  # policyTypes 增项并入本文件，并删除 pending 文件。
