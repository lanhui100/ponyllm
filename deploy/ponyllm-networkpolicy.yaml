apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ponyllm-egress-lockdown
  namespace: ponyllm
  labels:
    app.kubernetes.io/name: ponyllm
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ponyllm
      app.kubernetes.io/component: gateway
  policyTypes:
    - Egress
    - Ingress
  ingress:
    # VULN-14（Phase-3）：入站默认拒绝，仅放行三来源到 gateway:8080：
    # - kube-system：Traefik 入口流量（假设值，见下方复核注释）
    # - monitor：Prometheus 抓取 /metrics（与既有 egress 同名 ns 一致）
    # - ponyllm：本命名空间内副本/组件互访
    # 复核注释（cluster-infra）：Traefik 实际运行命名空间需复核确认——
    # 若实际为 traefik 等其他 ns，须将下方 kube-system 替换为实际 ns 并同步本文件；
    # kubelet 就绪/存活探针源（节点段）若被 CNI 网络策略拦截，需在 cluster-infra
    # 侧补充节点段放行（本 yaml 不臆造节点 CIDR）。
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitor
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ponyllm
      ports:
        - port: 8080
          protocol: TCP
  egress:
    # 1. 允许集群内 DNS 解析。注意：同一条 egress 规则内 to[] 与 ports[] 是 AND 语义的
    # 交集（目的必须同时匹配 to 且端口匹配 ports），首条仅放行发往 kube-dns:53 的
    # 流量；若改用 namespaceSelector:{} + podSelector 的组合写法，需确认 CNI 对
    # 跨 namespace podSelector 交集的实现语义，误拆成两条规则会放大放行面。
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # 2. 允许集群内相互通信与监控抓取：收敛为仅 ponyllm 自己 + monitor 命名空间
    #（matchLabels kubernetes.io/metadata.name 精确匹配），不再放行全集群
    #（旧 namespaceSelector:{} 会放行任意命名空间，风险靠 review 确认已消除）。
    - to:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ponyllm
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitor
    # 3. 允许出海与公网大模型访问，严格禁止访问云实例元数据（IMDS）：
    # 腾讯云 169.254.0.0/16、阿里云 100.100.100.200/32、通用 link-local 变体 192.0.0.192/32。
    # 注意：K8s NetworkPolicy 为白名单机制，未在此显式声明放行的 IPv6 及其他私网流量默认全部阻断（Default-Deny）。
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.0.0/16
              - 100.100.100.200/32
              - 192.0.0.192/32
