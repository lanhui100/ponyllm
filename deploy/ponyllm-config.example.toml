# ponyllm-config.example.toml — k8s secret `ponyllm-config` 的规范化参考片段
#
# 用途: 任何人重建 k8s secret（`kubectl create secret generic ponyllm-config \
#   --from-file=ponyllm.toml=...`）时必须使用本文件的接线形态，否则 407/404 复发。
# 完整 config 由 deploy 流程提供；这里只锁定**本轮的硬性接线不变量**。
#
# 不变量（2026-09-28 变更更新）:
#   1. opencode-zen（Muse 系列）：走 devserver (<DEVSERVER_IP>:8899) 路径模式直连，
#      后端通过 VPS 出口隧道转发（避开 Vercel 部署禁用与 CF Worker 区域限制 403）；
#      不带 proxy 字段。
#   2. Jev / Systemone 模型：支持直连 https://opencode.ai/zen/v1，无需代理。
#   3. antigravity：走 CONNECT 代理模式，proxy= 凭据形态不变（参照 live secret）。

[providers.opencode-zen]
# 示例为占位：真值（内网 IP + PATH_TOKEN）只进 live secret，绝不进仓库。
base_url = "http://192.0.2.1:8899/<PATH_TOKEN>/opencode/zen/v1"
default_model = "muse-spark-1.3-contributor-free"
strategy = "round_robin"
billing_mode = "metered"
input_price = 0.0
cached_price = 0.0
output_price = 0.0
models = [
    "mimo-v2.5-free",
    "muse-spark-1.3-contributor-free",
]
default_protocol = "responses"
# 注(2026-09-27)：deepseek-v4-flash-free 虽在上游目录但实测已下架
# (400 Model is unavailable)，暂不加入；mimo-v2.6-flash-free 经网关
# 真实推理验证通过（protocol = "chat"）。
default_protocol = "responses"

# Jev is kept in a separate provider so systemone metrics, traces, tokens,
# quota, and key health are isolated from text-generation Zen traffic.
[providers.zen-jev]
# Jev systemone supports direct HTTPS; proxy is optional for restricted egress.
base_url = "https://opencode.ai/zen/v1"
default_model = "jev-1.13-free"
strategy = "round_robin"
billing_mode = "free"
input_price = 0.0
cached_price = 0.0
output_price = 0.0
models = ["jev-1.13-free"]
default_protocol = "systemone"

# antigravity 走 CONNECT 代理模式，proxy= 凭据形态为占位（真 token 只进 live secret）
# [providers.antigravity]
# proxy = "http://user:<PPROXY_CLIENT_TOKEN>@pproxy-host.ponyllm.svc:8899"
# default_protocol = "antigravity"
# models = ["claude-sonnet-4-6", "gemini-3.1-flash-image"]
# 图像模型（OpenAI Images API 专用，/v1/images/generations 与 /v1/images/edits）：
# [[providers.antigravity.model_configs]]
# name = "gemini-3.1-flash-image"
# tier = "S"
# context_window = "1m"
# max_output = "32K"
# input_types = ["text", "image"]
# output_types = ["image"]

# ── 安全：Phase-3 HttpOnly Cookie 管理会话（VULN-05，默认关闭）────────────────
# 开启方式（生产建议启用，配合 Web 控制台后续版本）：
#   [gateway]
#   admin_session_enabled = true      # 挂载 /api/admin/session 会话路由并启用 cookie 鉴权
#   admin_session_ttl_secs = 28800    # 会话 TTL（8h，滑动刷新；默认 28800）
# 说明：开启后浏览器经 POST /api/admin/session 用 Bearer 换发 HttpOnly;Secure;
#   SameSite=Strict cookie，管理凭证不再常驻前端 sessionStorage（配合 XSS 加固断链）。
# 多副本注意：会话表为 per-pod 内存（上限 4096 LRU），replica 间不共享、重启即失效。
# 也可用环境变量在启动时覆盖：PONYLLM_ADMIN_SESSION_ENABLED=1 / PONYLLM_ADMIN_SESSION_TTL_SECS=<n>。
