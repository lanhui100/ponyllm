# ponyllm-config.example.toml — k8s secret `ponyllm-config` 的规范化参考片段
#
# 用途: 任何人重建 k8s secret（`kubectl create secret generic ponyllm-config \
#   --from-file=ponyllm.toml=...`）时必须使用本文件的接线形态，否则 407/404 复发。
# 完整 config 由 deploy 流程提供；这里只锁定**本轮的硬性接线不变量**。
#
# 不变量（2026-09-28 变更更新）:
#   1. opencode-zen（Muse 系列）：走 devserver (<DEVSERVER_IP>:8899) 路径模式直连，
#      后端通过 VPS 出口隧道转发（避开 Vercel 部署禁用与 CF Worker 区域限制 403）；
#      不带 proxy 字段。
#   2. Jev / Systemone 模型：支持直连 https://opencode.ai/zen/v1，无需代理。
#   3. antigravity：走 CONNECT 代理模式，proxy= 凭据形态不变（参照 live secret）。

[providers.opencode-zen]
# 示例为占位：真值（内网 IP + PATH_TOKEN）只进 live secret，绝不进仓库。
base_url = "http://192.0.2.1:8899/<PATH_TOKEN>/opencode/zen/v1"
default_model = "muse-spark-1.3-contributor-free"
strategy = "round_robin"
# 出口池轮询（2026-10-07 egress-pool 契约；2026-10-10 wave-5 T2 降爆炸半径回写）：
# zen 免费档按客户端出口 IP 记账（Redis ratelimit:ip:<ip>:<YYYYMMDD>，与 key 无关），
# 调度维度从 key 轮询改为出口池轮询以拆分额度桶。每出口独立记账独立冷却；
# 429 FreeUsageLimitError 只冷却该出口。条目：`direct`/`none`/空 = 网关本机直连出口；
# http(s):// 或 socks5:// = 经该代理出网（每个代理一个独立 IP）。显式配置后替代
# provider/model 的 proxy 字段语义；不配置（或为空）则维持单 proxy 零迁移。
# ⚠️ 2026-10-10 决策（wave-5 T2，降爆炸半径）：egress_pool 收敛为仅 ["direct"]。
#   动机：pproxy 曾整体卡死（accept 循环 Semaphore 饱和）拖垮全部 pproxy egress 出口，
#   导致 opencode-zen 下所有模型（含 space-bunny/mimo/step-5 这些未受地域封锁的免费档）
#   经 round_robin 选中 pproxy 出口时 10s 超时 503。移除未受封锁模型的 pproxy egress
#   依赖面；muse-spark-1.3-contributor-free 的模型级 base_url 仍指向 path-token pproxy
#   隧道（该模型必须经 pproxy 出海，模型级 base_url 不受本变更影响），antigravity 的
#   proxy= 同样保留（不在本决策范围）。
# 历史校准备忘（2026-10-09 五出口核实，机器收据 .dev-team/notes/wave-3-config-a-receipts.md）：
#   1) 条目校验（validate_egress_entry / check_egress_pool_entry）拒绝 100.64/10 CGNAT
#      字面 IP 与 *.svc —— 真实节点 IP 条目需先加入 PONYLLM_PROBE_ALLOWLIST
#      （deploy/ponyllm-deployment.yaml 的 env，部署层变更），否则 Admin PUT 直接
#      400 egress_blocked（实测：100.97.143.121 被拒）。
#   2) preprod/tencent 的 LAN 模式 pproxy 出口当前经 VPS gate（实测 192.210.231.8），
#      与 vps 条目同 IP；独立 IP 需各节点 pproxy 配本地直连 upstream（cluster-infra 职责）。
#   3) egress_pool 只控制客户端拨号出口：base_url 若仍指向 path-token pproxy 隧道，
#      所有条目最终同一出口。拆分 IP 桶的前提是 base_url 为直连上游（如 https://opencode.ai/zen/v1）。
# 凭据形态：需要客户端凭据的 pproxy 用 user:pass@ userinfo（参考 deploy/pproxy-service.md L37）；
# 真实 token 只进 live secret（视图侧脱敏为 scheme://host:port，执行器持 raw URL）。
egress_pool = [
    "direct",   # 网关本机直连出口（devserver 宿主实测 115.63.111.139，CN 郑州联通）—— 2026-10-10 起仅保留此条目
]
egress_strategy = "round_robin"   # round_robin（默认）| priority（取首个可用）
billing_mode = "metered"
input_price = 0.0
cached_price = 0.0
output_price = 0.0
models = [
    "mimo-v2.5-free",
    "muse-spark-1.3-contributor-free",
    "space-bunny-free",
]
default_protocol = "responses"
# 注(2026-09-27)：deepseek-v4-flash-free 虽在上游目录但实测已下架
# (400 Model is unavailable)，暂不加入；mimo-v2.6-flash-free 经网关
# 真实推理验证通过（protocol = "chat"）。
default_protocol = "responses"

# space-bunny-free（2026-10-06）：上游 listing 1M 上下文 / 512K 输出 /
# text+image+video 输入 / 强制推理默认 max。protocol 显式 chat
#（fledge-alpha-free 实测 responses 报 ModelProtocolUnsupported，切 chat 可用）。
[[providers.opencode-zen.model_configs]]
name = "space-bunny-free"
tier = "S"
context_window = "1M"
max_output = "512K"
input_types = ["text", "image", "video"]
output_types = ["text"]
protocol = "chat"
thinking_default = "max"
thinking_max = "max"

# Jev is kept in a separate provider so systemone metrics, traces, tokens,
# quota, and key health are isolated from text-generation Zen traffic.
[providers.zen-jev]
# Jev systemone supports direct HTTPS; proxy is optional for restricted egress.
base_url = "https://opencode.ai/zen/v1"
default_model = "jev-1.13-free"
strategy = "round_robin"
billing_mode = "free"
input_price = 0.0
cached_price = 0.0
output_price = 0.0
models = ["jev-1.13-free"]
default_protocol = "systemone"

# antigravity 走 CONNECT 代理模式，proxy= 凭据形态为占位（真 token 只进 live secret）
# [providers.antigravity]
# proxy = "http://user:<PPROXY_CLIENT_TOKEN>@pproxy-host.ponyllm.svc:8899"
# default_protocol = "antigravity"
# models = ["claude-sonnet-4-6", "gemini-3.1-flash-image"]
# 图像模型（OpenAI Images API 专用，/v1/images/generations 与 /v1/images/edits）：
# [[providers.antigravity.model_configs]]
# name = "gemini-3.1-flash-image"
# tier = "S"
# context_window = "1m"
# max_output = "32K"
# input_types = ["text", "image"]
# output_types = ["image"]

# ── 安全：Phase-3 HttpOnly Cookie 管理会话（VULN-05，默认关闭）────────────────
# 开启方式（生产建议启用，配合 Web 控制台后续版本）：
#   [gateway]
#   admin_session_enabled = true      # 挂载 /api/admin/session 会话路由并启用 cookie 鉴权
#   admin_session_ttl_secs = 28800    # 会话 TTL（8h，滑动刷新；默认 28800）
# 说明：开启后浏览器经 POST /api/admin/session 用 Bearer 换发 HttpOnly;Secure;
#   SameSite=Strict cookie，管理凭证不再常驻前端 sessionStorage（配合 XSS 加固断链）。
# 多副本注意：会话表为 per-pod 内存（上限 4096 LRU），replica 间不共享、重启即失效。
# 也可用环境变量在启动时覆盖：PONYLLM_ADMIN_SESSION_ENABLED=1 / PONYLLM_ADMIN_SESSION_TTL_SECS=<n>。
