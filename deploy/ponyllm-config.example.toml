# ponyllm-config.example.toml — k8s secret `ponyllm-config` 的规范化参考片段
#
# 用途: 任何人重建 k8s secret（`kubectl create secret generic ponyllm-config \
#   --from-file=ponyllm.toml=...`）时必须使用本文件的接线形态，否则 407/404 复发。
# 完整 config 由 deploy 流程提供；这里只锁定**本轮的硬性接线不变量**。
#
# 不变量（2026-09-28 变更更新）:
#   1. opencode-zen（Muse 系列）：走 devserver (<DEVSERVER_IP>:8899) 路径模式直连，
#      后端通过 VPS 出口隧道转发（避开 Vercel 部署禁用与 CF Worker 区域限制 403）；
#      不带 proxy 字段。
#   2. Jev / Systemone 模型：支持直连 https://opencode.ai/zen/v1，无需代理。
#   3. antigravity：走 CONNECT 代理模式，proxy= 凭据形态不变（参照 live secret）。
#   4. magpie（2026-11-07）：base_url 必须是 devserver 的 tailnet 字面 IP
#      `http://100.95.193.103:3425/v1`，且该 IP 必须同时出现在 Deployment 的
#      PONYLLM_PROBE_ALLOWLIST 里——egress.rs 的 blocked_v4 把 100.64/10（CGNAT）
#      判为 blocked address，数据面拨号与 admin 写路径（check_probe_url_fast）
#      同口径拒绝。两者成对维护，见本节 [providers.magpie]。
#   5. gemini（2026-11-15）：base_url 用 Gemini 的版本根 `/v1beta`（不是 OpenAI 的
#      `/v1`），`default_protocol = "gemini"` 才会走原生 `generateContent`；
#      key 由执行器放进 `x-goog-api-key`（不是 Bearer）。境内需 proxy/egress 出网，
#      见本节 [providers.gemini]。

[providers.opencode-zen]
# 示例为占位：真值（内网 IP + PATH_TOKEN）只进 live secret，绝不进仓库。
base_url = "http://192.0.2.1:8899/<PATH_TOKEN>/opencode/zen/v1"
default_model = "muse-spark-1.3-contributor-free"
strategy = "round_robin"
# 出口池轮询（2026-10-07 egress-pool 契约；2026-10-10 wave-5 T2 降爆炸半径回写）：
# zen 免费档按客户端出口 IP 记账（Redis ratelimit:ip:<ip>:<YYYYMMDD>，与 key 无关），
# 调度维度从 key 轮询改为出口池轮询以拆分额度桶。每出口独立记账独立冷却；
# 429 FreeUsageLimitError 只冷却该出口。条目：`direct`/`none`/空 = 网关本机直连出口；
# http(s):// = 经该代理出网（每个代理一个独立 IP）。显式配置后替代
# provider/model 的 proxy 字段语义；不配置（或为空）则维持单 proxy 零迁移。
# ⚠️ 2026-10-23 安全变更（contract v3/v6）：`socks5://` / `socks5h://` **一律被拒绝**
#   （validate_egress_entry 与 admin 写路径的 check_proxy_url_fast 同口径）。本网关
#   的 reqwest 未编译 socks feature，接受 socks 条目只会静默回退直连 = 出网语义脱钩。
#   迁移：改用 http(s) CONNECT 代理（如 pproxy 的 http 口），见
#   docs/security/2026-10-23-egress-socks-rejection-migration.md
# ⚠️ 2026-10-10 决策（wave-5 T2，降爆炸半径）：egress_pool 收敛为仅 ["direct"]。
#   动机：pproxy 曾整体卡死（accept 循环 Semaphore 饱和）拖垮全部 pproxy egress 出口，
#   导致 opencode-zen 下所有模型（含 space-bunny/mimo/step-5 这些未受地域封锁的免费档）
#   经 round_robin 选中 pproxy 出口时 10s 超时 503。移除未受封锁模型的 pproxy egress
#   依赖面；muse-spark-1.3-contributor-free 的模型级 base_url 仍指向 path-token pproxy
#   隧道（该模型必须经 pproxy 出海，模型级 base_url 不受本变更影响），antigravity 的
#   proxy= 同样保留（不在本决策范围）。
# 历史校准备忘（2026-10-09 五出口核实，机器收据 .dev-team/notes/wave-3-config-a-receipts.md）：
#   1) 条目校验（validate_egress_entry / check_egress_pool_entry）拒绝 100.64/10 CGNAT
#      字面 IP 与 *.svc —— 真实节点 IP 条目需先加入 PONYLLM_PROBE_ALLOWLIST
#      （deploy/ponyllm-deployment.yaml 的 env，部署层变更），否则 Admin PUT 直接
#      400 egress_blocked（实测：100.97.143.121 被拒）。
#   2) preprod/tencent 的 LAN 模式 pproxy 出口当前经 VPS gate（实测 192.210.231.8），
#      与 vps 条目同 IP；独立 IP 需各节点 pproxy 配本地直连 upstream（cluster-infra 职责）。
#   3) egress_pool 只控制客户端拨号出口：base_url 若仍指向 path-token pproxy 隧道，
#      所有条目最终同一出口。拆分 IP 桶的前提是 base_url 为直连上游（如 https://opencode.ai/zen/v1）。
# 凭据形态：需要客户端凭据的 pproxy 用 user:pass@ userinfo（参考 deploy/pproxy-service.md L37）；
# 真实 token 只进 live secret（视图侧脱敏为 scheme://host:port，执行器持 raw URL）。
egress_pool = [
    "direct",   # 网关本机直连出口（devserver 宿主实测 115.63.111.139，CN 郑州联通）—— 2026-10-10 起仅保留此条目
]
egress_strategy = "round_robin"   # round_robin（默认）| priority（取首个可用）
billing_mode = "metered"
input_price = 0.0
cached_price = 0.0
output_price = 0.0
models = [
    "mimo-v2.5-free",
    "muse-spark-1.3-contributor-free",
    "space-bunny-free",
]
default_protocol = "responses"
# 注(2026-09-27)：deepseek-v4-flash-free 虽在上游目录但实测已下架
# (400 Model is unavailable)，暂不加入；mimo-v2.6-flash-free 经网关
# 真实推理验证通过（protocol = "chat"）。

# space-bunny-free（2026-10-06）：上游 listing 1M 上下文 / 512K 输出 /
# text+image+video 输入 / 强制推理默认 max。protocol 显式 chat
#（fledge-alpha-free 实测 responses 报 ModelProtocolUnsupported，切 chat 可用）。
[[providers.opencode-zen.model_configs]]
name = "space-bunny-free"
tier = "S"
context_window = "1M"
max_output = "512K"
input_types = ["text", "image", "video"]
output_types = ["text"]
protocol = "chat"
thinking_default = "max"
thinking_max = "max"

# Vercel AI Gateway - Laya System One 决策模型
[providers.vercel]
base_url = "https://ai-gateway.vercel.sh/typesafe/v1"
default_model = "convaiinnovations/laya"
strategy = "priority"
billing_mode = "free"
input_price = 0.0
cached_price = 0.0
output_price = 0.0
models = [
    "convaiinnovations/laya",
    "laya",
    "convaiinnovations/laya-free",
]
default_protocol = "systemone"

# antigravity 走 CONNECT 代理模式，proxy= 凭据形态为占位（真 token 只进 live secret）
# [providers.antigravity]
# proxy = "http://user:<PPROXY_CLIENT_TOKEN>@pproxy-host.ponyllm.svc:8899"
# default_protocol = "antigravity"
# models = ["claude-sonnet-4-6", "gemini-3.1-flash-image"]
# 图像模型（OpenAI Images API 专用，/v1/images/generations 与 /v1/images/edits）：
# [[providers.antigravity.model_configs]]
# name = "gemini-3.1-flash-image"
# tier = "S"
# context_window = "1m"
# max_output = "32K"
# input_types = ["text", "image"]
# output_types = ["image"]

# ── magpie：宿主机 Docker AI 网关（2026-11-07 接入，决策见
#    .agents/notes/implemented/feature/2026-11-07-magpie-provider-in-ponyllm-gateway.md）
#
# 形态：magpie 容器跑在 devserver，只监听 tailnet 双栈；ponyllm 经 tailnet 字面 IP 直连，
#   不配 proxy、不配 egress_pool（直连最短路）。
# 凭据：magpie 的网关密钥（`docker exec magpie magpie gateway-key add <name>` 签发）
#   进 key 池（Admin API `POST /api/admin/keys`），与 ponyllm 自身 gateway-key 体系无关。
# 成本：billing_mode=metered + 三档 0.0 —— magpie 侧是订阅额度，网关不核算成本；
#   若要让 economy 策略按真实成本决策，改 `free` 或填真实单价（另一次决策）。
[providers.magpie]
base_url = "http://100.95.193.103:3425/v1"
proxy = "direct"                  # 直连免疫：Tailscale 内网直达，严禁继承出海代理（防 pproxy idle timeout 断流）
default_model = "default"          # 占位；真值以 magpie 目录为准（新增上游后需重映射）
strategy = "priority"
billing_mode = "metered"
input_price = 0.0
cached_price = 0.0
output_price = 0.0
default_protocol = "chat"          # magpie 讲 Chat/Responses/Anthropic/Gemini 并可互译
models = [
    "trae-cn/deepseek-v4.1-flash",
    "group/smart-split",
# 下架（2026-11-07，实测）：trae-cn/kimi-k3.1-pro-auto 与 -auto-max 对 Trae CN 的
# 参数校验不兼容——非流式、或带 max_tokens 一律 4001 "param is invalid"（magpie 侧直连
# 即 502，非网关问题）。上游修好后可原样加回，见 ADR 收据。
]

# 元数据取 magpie GET /v1/models 原值；magpie 的思考档位只有 low/high/xhigh，
# 网关侧映射到 low/high/max 三档（off 表示不带 reasoning 字段）。
[[providers.magpie.model_configs]]
name = "trae-cn/deepseek-v4.1-flash"
tier = "S"
context_window = "116k"
max_output = "16k"
input_types = ["text", "image"]
output_types = ["text"]
thinking_default = "high"
thinking_max = "max"
thinking_efforts = { off = "", low = "low", high = "high", max = "xhigh" }

[[providers.magpie.model_configs]]
name = "group/smart-split"         # magpie 的意图路由组：简单题给便宜模型，难题给强模型
tier = "F"
context_window = "200k"
max_output = "32k"
input_types = ["text", "image"]
output_types = ["text"]
thinking_default = "high"
thinking_max = "max"
thinking_efforts = { off = "", low = "low", high = "high", max = "xhigh" }

# ── gemini：Google Gemini Developer API 原生协议（2026-11-15 接入）
#
# 形态：base_url 用 Gemini 的版本根 `https://generativelanguage.googleapis.com/v1beta`
#   （Gemini 的版本根不是 OpenAI 的 `/v1`，`normalize_gemini_url` 只接受这一形态）。
#   `default_protocol = "gemini"` 让网关/嵌入式 SDK 走原生 `generateContent`
#   （内部以 Chat 为枢轴双向翻译，下游仍可用 chat/messages/responses 三个入口）。
#   模型名带不带 `models/` 前缀都可以，配置里建议去掉。
# 凭据：静态 API key 由执行器放进 `x-goog-api-key` 请求头（**不是** Bearer）；
#   真实 key 只进 live secret / Admin API，仓库里一律 `<GEMINI_API_KEY>` 占位。
# 出网：generativelanguage.googleapis.com 在境内不可直连，**必须**经 proxy 或
#   egress_pool 出海；示例给 `direct` 占位，实际部署换成可用的 CONNECT 代理出口
#   （socks5 已被 validate_egress_entry 拒绝，见上文 opencode-zen 段说明）。
[providers.gemini]
base_url = "https://generativelanguage.googleapis.com/v1beta"
default_model = "gemini-4-hydrogen"
strategy = "priority"
billing_mode = "metered"
input_price = 0.0
cached_price = 0.0
output_price = 0.0
default_protocol = "gemini"
models = [
    "gemini-4-hydrogen",
    "gemini-3.8-flash",
    "gemini-3.6-flash",
    "gemini-3.1-flash-lite",
]
# 免费层额度（实测 2026-11-15）：按项目+模型 20 次/日；RPM/TPM 以 AI Studio
# 该项目的 rate-limit 页为准。429 body 的 quotaId 为
# `GenerateRequestsPerDayPerProjectPerModel-FreeTier`（quotaValue=20）。
# 热门模型（3.8-flash）会返回 503 high demand，因此用模型级 fallbacks 在同
# provider 内自动降级（仍走 Gemini 协议）。
[[providers.gemini.model_configs]]
name = "gemini-4-hydrogen"
tier = "F"
context_window = "1M"
max_output = "64K"
# Hydrogen 输入：text / image / PDF(文档) / audio / video；同步输出 64K
# （thinking 与可见输出共享 64K），上下文 1,048,576 由输入+思考+输出共享。
input_types = ["text", "image", "audio", "video", "file"]
output_types = ["text"]
# 四档：low / medium / high(默认) / xhigh（网关 Max→xhigh，minimal 被上游拒绝）。
thinking_default = "high"
thinking_max = "max"
fallbacks = ["gemini-3.8-flash", "gemini-3.6-flash", "gemini-3.1-flash-lite"]

[[providers.gemini.model_configs]]
name = "gemini-3.8-flash"
tier = "F"
context_window = "1M"
max_output = "64K"
input_types = ["text", "image", "audio", "video", "file"]
output_types = ["text"]
fallbacks = ["gemini-3.6-flash", "gemini-3.1-flash-lite"]

[[providers.gemini.model_configs]]
name = "gemini-3.6-flash"
tier = "S"
context_window = "1M"
max_output = "64K"
input_types = ["text", "image", "audio", "video", "file"]
output_types = ["text"]
fallbacks = ["gemini-3.1-flash-lite"]

[[providers.gemini.model_configs]]
name = "gemini-3.1-flash-lite"
tier = "L"
context_window = "1M"
max_output = "64K"
input_types = ["text", "image", "audio", "video", "file"]
output_types = ["text"]

# 境内出网：把 "direct" 换成真实 CONNECT 代理条目（如 pproxy 的 http 口），
# 或保留 "direct" 表示网关节点本身已有可用出口。
egress_pool = ["direct"]
egress_strategy = "round_robin"
# key 形态（真值不进仓库；也可用 Admin API `POST /api/admin/keys` 注入）：
# [[providers.gemini.keys]]
# id = "gemini-key-1"
# api_key = "<GEMINI_API_KEY>"
# priority = 1
# weight = 10

# ── 安全：Phase-3 HttpOnly Cookie 管理会话（VULN-05，默认关闭）────────────────
# 开启方式（生产建议启用，配合 Web 控制台后续版本）：
#   [gateway]
#   admin_session_enabled = true      # 挂载 /api/admin/session 会话路由并启用 cookie 鉴权
#   admin_session_ttl_secs = 28800    # 会话 TTL（8h，滑动刷新；默认 28800）
# 说明：开启后浏览器经 POST /api/admin/session 用 Bearer 换发 HttpOnly;Secure;
#   SameSite=Strict cookie，管理凭证不再常驻前端 sessionStorage（配合 XSS 加固断链）。
# 多副本注意：会话表为 per-pod 内存（上限 4096 LRU），replica 间不共享、重启即失效。
# 也可用环境变量在启动时覆盖：PONYLLM_ADMIN_SESSION_ENABLED=1 / PONYLLM_ADMIN_SESSION_TTL_SECS=<n>。

# ── 路由：聚合模型（优先级链 + 链项冷却回归，2026-11-23）─────────────────────
# 场景：免费通道（并发低）为主、同名异源顶替、冷却到期自动回主。
# 语义（契约 .agents/notes/implemented/architecture/2026-11-23-aggregate-model-priority-chain.md）：
#   • chain 的顺序 = 执行顺序，网关不会按价格/延迟重排；
#   • 条目必须写成 `provider/model`，用于消解跨 provider 的命名差异；
#   • 链项失败后冷却 cooldown_secs（默认 90s），冷却期内被跳过，到期回到原位；
#   • 链即授权：链里写了谁就按顺序用谁，含付费项（不设单独的「是否允许付费」开关；
#     成本可见性靠链项 billing_mode 与 aggregate_fallback 事件）。
# 启用后客户端直接请求 `deepseek-free` 即可（/v1/models 会列出该虚拟名）。
# [gateway]
# [[gateway.aggregate_models]]
# name = "deepseek-free"
# chain = ["sense/deepseek-flash", "magpie/deepseek-v4.1-flash", "workbuddy/deepseek-v4.1-flash"]
# cooldown_secs = 90
#
# 等价管理面（Web 控制台「聚合模型」卡片走同一接口）：
#   GET /api/admin/aggregate-models
#   PUT /api/admin/aggregate-models   （需 If-Match: <config_version>）

