[package]
name = "ponyllm-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Core runtime, key pooling, failover and telemetry for ponyllm"

[dependencies]
ponyllm-protocol = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
futures-util = { workspace = true }
bytes = { workspace = true }
# wave-10 (task-6): multipart form upload for `/api/v0/file/upload_file`
# (H-V01). reqwest's `multipart` is an opt-in feature not in the workspace
# defaults; enabling it here adds capability only (feature unification).
reqwest = { workspace = true, features = ["multipart"] }
tracing = { workspace = true }
parking_lot = { workspace = true }
dashmap = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
utoipa = { workspace = true }
# Cross-replica refresh serialization seam (multi-node HA): async-trait keeps
# the trait dyn-safe so ponyllm-server can inject its PG/in-memory gates.
async-trait = { workspace = true }
# B001 contract (web user JWT + token system, stub-frozen): HS256 JWT via
# ring::hmac + base64 0.22 (both already in Cargo.lock — ring 0.17.14 via
# rustls, base64 0.22.1 via workspace; zero new version resolution).
ring = "0.17"
base64 = { workspace = true }
sha3 = "0.10"
# L3A F4: peek 深链 completion 2xx 响应头判断 biz_code 信封（40012/40301）
# 并重建流。http-body-util 0.1.5 已在 Cargo.lock（reqwest 的既有传递依赖，
# 零新版本解析）；仅在此处直接声明以便用 BodyExt::into_data_stream 拆流。
http-body-util = "0.1.5"
# http crate (1.x) 与 reqwest 同源版本，用于 http::Response 重建（From 互转公开）。
http = "1"

[dev-dependencies]
axum = { workspace = true }
chrono = { workspace = true }
tempfile = { workspace = true }

